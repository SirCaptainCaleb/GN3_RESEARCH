name: Temporary A7C3 R1 nonactive-result migration

on:
  push:
    branches:
      - migration/nonactive-results-r1-20260912

permissions:
  contents: write
  id-token: write

jobs:
  migrate-r1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migration/nonactive-results-r1-20260912
          fetch-depth: 0

      - name: Guard branch frontier
        shell: bash
        run: |
          set -euo pipefail
          BASE=813c6d1e081cf9d773d0af948f492422a507fae7
          test "$(git merge-base HEAD "$BASE")" = "$BASE"
          git diff --quiet "$BASE" -- A7C3/RESULTS/USABLE/ACTIVE A7C3/WORKSPACE A7C3/STRATEGY A7C3/REFERENCES

      - name: Fetch authoritative Supabase snapshot through GitHub OIDC
        shell: bash
        run: |
          set -euo pipefail
          oidc_url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=a7c3-migration"
          token="$(curl -fsSL -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "$oidc_url" | python -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          curl -fsSL -H "Authorization: Bearer ${token}" \
            https://hhfflgtfcunpywdsisae.supabase.co/functions/v1/a7c3-migration-export \
            -o /tmp/a7c3-snapshot.json
          python - <<'PY'
          import json, os
          p=json.load(open('/tmp/a7c3-snapshot.json'))
          if 'error' in p: raise RuntimeError(p['error'])
          print('snapshot_bytes',os.path.getsize('/tmp/a7c3-snapshot.json'),'exported_at',p['exported_at'])
          PY

      - name: Render owned result subtrees
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "A7C3 Migration R1"
          git config user.email "a7c3-migration-r1@users.noreply.github.com"
          python scripts/a7c3_migrate.py legacy
          python scripts/a7c3_migrate.py unusable

      - name: Independently rerender and SHA-verify every owned file
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/r1-expected
          mkdir -p /tmp/r1-expected
          cp scripts/a7c3_migrate.py /tmp/r1-expected/a7c3_migrate.py
          (
            cd /tmp/r1-expected
            python a7c3_migrate.py legacy
            python a7c3_migrate.py unusable
          )
          python - <<'PY'
          import hashlib,json,re
          from pathlib import Path
          actual=Path('.')
          expected=Path('/tmp/r1-expected')
          relroots=[Path('A7C3/RESULTS/USABLE/LEGACY'),Path('A7C3/RESULTS/UNUSABLE/INVALID'),Path('A7C3/RESULTS/UNUSABLE/QUARANTINED')]
          result_name=re.compile(r'R\d+\.md')
          def result_map(root):
              out={}
              for rr in relroots:
                  d=root/rr
                  if not d.exists(): continue
                  for p in d.iterdir():
                      if p.is_file() and result_name.fullmatch(p.name): out[str(rr/p.name)]=p
              return out
          a=result_map(actual); e=result_map(expected)
          if set(a)!=set(e): raise RuntimeError(f'identity mismatch missing={sorted(set(e)-set(a))} extra={sorted(set(a)-set(e))}')
          if len(e)!=437: raise RuntimeError(f'owned id count {len(e)} != 437')
          def blobsha(b): return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          mism=[]; no_proof=0
          marker=b'No preferred proof was present in the authoritative Supabase record.'
          for rel in sorted(e):
              eb=e[rel].read_bytes(); ab=a[rel].read_bytes()
              es=blobsha(eb); ass=blobsha(ab)
              if len(eb)!=len(ab) or es!=ass: mism.append((rel,len(eb),len(ab),es,ass))
              no_proof += marker in eb
          if mism: raise RuntimeError(f'byte/SHA mismatch total={len(mism)} first={mism[:3]}')
          counts={
            'legacy':sum(result_name.fullmatch(p.name) is not None for p in (actual/'A7C3/RESULTS/USABLE/LEGACY').iterdir() if p.is_file()),
            'invalid':sum(result_name.fullmatch(p.name) is not None for p in (actual/'A7C3/RESULTS/UNUSABLE/INVALID').iterdir() if p.is_file()),
            'quarantined':sum(result_name.fullmatch(p.name) is not None for p in (actual/'A7C3/RESULTS/UNUSABLE/QUARANTINED').iterdir() if p.is_file()),
          }
          if counts != {'legacy':287,'invalid':0,'quarantined':150}: raise RuntimeError(f'folder counts {counts}')
          r5='A7C3/RESULTS/UNUSABLE/QUARANTINED/R5.md'; r24='A7C3/RESULTS/UNUSABLE/QUARANTINED/R24.md'
          if r5 not in a or r24 not in a: raise RuntimeError('R5/R24 quarantine location failure')
          for rr in relroots:
              d=actual/rr
              allowed={'README.md'}|{Path(k).name for k in a if str(rr)+'/' in k}
              extras={p.name for p in d.iterdir()}-allowed
              if extras: raise RuntimeError(f'temporary/stale artifacts in {rr}: {sorted(extras)}')
          print(json.dumps({'verification':'PASS','sha_verified_files':len(e),'legacy_current':287,'invalid_current':0,'quarantined_current':149,'historical_r24':1,'proof_bearing':len(e)-no_proof,'no_proof':no_proof,'r5':r5,'r24':r24,'base64_repairs':[]},sort_keys=True))
          PY

      - name: Commit owned corpus, restore scaffold, and push candidate
        shell: bash
        run: |
          set -euo pipefail
          BASE=813c6d1e081cf9d773d0af948f492422a507fae7
          git add -A A7C3/RESULTS/USABLE/LEGACY A7C3/RESULTS/UNUSABLE
          git commit -m "Migrate non-active durable result corpus"
          echo "CORPUS_COMMIT=$(git rev-parse HEAD)"
          echo "LEGACY_TREE=$(git rev-parse HEAD:A7C3/RESULTS/USABLE/LEGACY)"
          echo "UNUSABLE_TREE=$(git rev-parse HEAD:A7C3/RESULTS/UNUSABLE)"
          git checkout "$BASE" -- .github/workflows/a7c3-corpus-migrate.yml
          git rm -f scripts/a7c3_migrate.py
          git add .github/workflows/a7c3-corpus-migrate.yml
          git commit -m "Restore temporary migration scaffold"
          git diff --quiet "$BASE" HEAD -- .github scripts A7C3/RESULTS/USABLE/ACTIVE A7C3/WORKSPACE A7C3/STRATEGY A7C3/REFERENCES
          echo "FINAL_COMMIT=$(git rev-parse HEAD)"
          echo "FINAL_LEGACY_TREE=$(git rev-parse HEAD:A7C3/RESULTS/USABLE/LEGACY)"
          echo "FINAL_UNUSABLE_TREE=$(git rev-parse HEAD:A7C3/RESULTS/UNUSABLE)"
          test -z "$(git status --porcelain)"
          git push origin HEAD:migration/nonactive-results-r1-20260912
