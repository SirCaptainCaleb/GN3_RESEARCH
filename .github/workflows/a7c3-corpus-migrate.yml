name: Temporary A7C3 corpus migration

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]

permissions:
  contents: write
  id-token: write

jobs:
  migrate:
    if: >-
      (github.event_name == 'issues' && github.event.issue.title == 'A7C3 corpus migration trigger 2026-09-12') ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'migration-corpus-20260912')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migration-corpus-20260912
          fetch-depth: 0

      - name: Guard staging frontier
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 42eb54bde5a1d69313c6a5e5bf9c2625240922a6 HEAD
          test "$(git rev-parse 42eb54bde5a1d69313c6a5e5bf9c2625240922a6:A7C3/WORKSPACE/D17)" = "02bc036b1b37a15a9dcd56fa5ad628358aef8b3c"
          test "$(git rev-parse HEAD:A7C3/WORKSPACE/D17)" = "02bc036b1b37a15a9dcd56fa5ad628358aef8b3c"

      - name: Fetch authoritative Supabase snapshot through GitHub OIDC
        shell: bash
        run: |
          set -euo pipefail
          oidc_url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=a7c3-migration"
          token="$(curl -fsSL -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "$oidc_url" | python -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          curl -fsSL -H "Authorization: Bearer ${token}" \
            https://hhfflgtfcunpywdsisae.supabase.co/functions/v1/a7c3-migration-export \
            -o /tmp/a7c3-snapshot.json
          python - <<'PY'
          import json, os
          p=json.load(open('/tmp/a7c3-snapshot.json'))
          if 'error' in p: raise RuntimeError(p['error'])
          print('snapshot bytes', os.path.getsize('/tmp/a7c3-snapshot.json'), 'exported_at', p['exported_at'])
          PY

      - name: Migrate remaining active workspaces
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "A7C3 Migration"
          git config user.email "a7c3-migration@users.noreply.github.com"
          python scripts/a7c3_migrate.py workspaces
          test "$(git rev-parse HEAD:A7C3/WORKSPACE/D17)" = "02bc036b1b37a15a9dcd56fa5ad628358aef8b3c"
          git add -A A7C3/WORKSPACE
          git diff --cached --quiet || git commit -m "Migrate remaining active workspaces"

      - name: Migrate active usable results
        shell: bash
        run: |
          set -euo pipefail
          python scripts/a7c3_migrate.py active
          git add -A A7C3/RESULTS/USABLE/ACTIVE
          git diff --cached --quiet || git commit -m "Migrate active usable result corpus"

      - name: Migrate usable legacy results
        shell: bash
        run: |
          set -euo pipefail
          python scripts/a7c3_migrate.py legacy
          git add -A A7C3/RESULTS/USABLE/LEGACY
          git diff --cached --quiet || git commit -m "Migrate usable legacy result corpus"

      - name: Migrate unusable and quarantined results
        shell: bash
        run: |
          set -euo pipefail
          python scripts/a7c3_migrate.py unusable
          git add -A A7C3/RESULTS/UNUSABLE
          git diff --cached --quiet || git commit -m "Migrate unusable and quarantined result corpus"

      - name: Audit candidate and remove staging scaffolding
        shell: bash
        run: |
          set -euo pipefail
          python scripts/a7c3_migrate.py audit
          test "$(git rev-parse HEAD:A7C3/WORKSPACE/D17)" = "02bc036b1b37a15a9dcd56fa5ad628358aef8b3c"
          git rm -f scripts/a7c3_migrate.py .github/workflows/a7c3-corpus-migrate.yml
          git commit -m "Remove migration staging scaffolding"
          test -z "$(git status --porcelain)"
          git log --oneline --decorate -10
          git push origin HEAD:migration-corpus-20260912
