name: Build A7C3 search corpus

on:
  push:
    branches:
      - main
    paths:
      - 'A7C3/**'
      - 'scripts/build_search_corpus.py'
      - '.github/workflows/build-search-corpus.yml'
      - '!A7C3/SEARCH_CORPUS.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build corpus
        run: python3 scripts/build_search_corpus.py

      - name: Commit corpus if changed
        shell: bash
        run: |
          if git diff --quiet -- A7C3/SEARCH_CORPUS.md; then
            echo 'Search corpus is already current.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add A7C3/SEARCH_CORPUS.md
          git commit -m 'Rebuild A7C3 search corpus [skip ci]'
          git push
