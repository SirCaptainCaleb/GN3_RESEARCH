name: Sync GN3N research mirror
# audit model refresh

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-gn3n-research-mirror.yml"

permissions:
  contents: write

jobs:
  sync:
    uses: ./.github/workflows/sync-research-schema.yml
    with:
      schema: gn3n
    secrets: inherit
