name: NORI | Refresh research artifact
# coordination strategy rollout: final atomic-publication API and rank-aware artifact

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/sync-nori-research-mirror.yml

permissions:
  contents: write
  actions: write

jobs:
  sync:
    uses: ./.github/workflows/sync-research-schema.yml
    with:
      schema: nori
    secrets: inherit

  build:
    needs: sync
    uses: ./.github/workflows/build-research-schema-artifact.yml
    with:
      schema: nori
    secrets: inherit
