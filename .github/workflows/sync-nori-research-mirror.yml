name: NORI | Refresh research artifact
# Article XI: two-resource Hamiltonian recognition, legal one-for-two augmentation, and factor-three switch-rank theorem.
# Research context snapshot refresh: include the self-contained Article XIV introduction and type-A rook-gallery results.
# Refresh requested 2026-10-14: rebuild NORI research-context artifact from the latest nori schema.
# Refresh requested 2026-10-16: regenerate NORI artifact with latest Eulerian and doubled-direction holonomy research.
# Refresh requested 2026-10-16: regenerate NORI research artifact with latest geodesic profile transport and root-fiber results.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/sync-nori-research-mirror.yml
      - scripts/sync_research_mirror.py
concurrency:
  group: nori-schema-artifact-refresh
  cancel-in-progress: false
permissions:
  contents: write
  actions: write
jobs:
  sync:
    uses: ./.github/workflows/sync-research-schema.yml
    with:
      schema: nori
    secrets: inherit
  build:
    needs: sync
    uses: ./.github/workflows/build-research-schema-artifact.yml
    with:
      schema: nori
    secrets: inherit
