name: NORI | Refresh research artifact
# Article XI: three-matroid legal path model, sharp bounded-cost block reversal, and nonoptimal 2-opt plateau note.
# Canonical manuscript only; regenerate from Supabase.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/sync-nori-research-mirror.yml
      - scripts/sync_research_mirror.py
concurrency:
  group: nori-schema-artifact-refresh
  cancel-in-progress: false
permissions:
  contents: write
  actions: write
jobs:
  sync:
    uses: ./.github/workflows/sync-research-schema.yml
    with:
      schema: nori
    secrets: inherit
  build:
    needs: sync
    uses: ./.github/workflows/build-research-schema-artifact.yml
    with:
      schema: nori
    secrets: inherit
