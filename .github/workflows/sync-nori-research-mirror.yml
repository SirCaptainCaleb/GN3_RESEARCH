name: NORI | Refresh research artifact
# Refresh NORI research artifact from the current Supabase state.
# Manual refresh requested after GUIDE.md publication-standard revision.
# NORI assembled publication: canonical manuscript only, universal guide/reflexes, no overview appendix mirror or worker prompt

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/sync-nori-research-mirror.yml
      - scripts/sync_research_mirror.py

concurrency:
  group: nori-schema-artifact-refresh
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  sync:
    uses: ./.github/workflows/sync-research-schema.yml
    with:
      schema: nori
    secrets: inherit

  build:
    needs: sync
    uses: ./.github/workflows/build-research-schema-artifact.yml
    with:
      schema: nori
    secrets: inherit
