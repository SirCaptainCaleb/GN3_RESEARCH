name: NORI | Refresh research artifact
# NORI assembled publication: compact evidence-oriented research-note map final verification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/sync-nori-research-mirror.yml

concurrency:
  group: nori-schema-artifact-refresh
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  sync:
    uses: ./.github/workflows/sync-research-schema.yml
    with:
      schema: nori
    secrets: inherit

  build:
    needs: sync
    uses: ./.github/workflows/build-research-schema-artifact.yml
    with:
      schema: nori
    secrets: inherit
