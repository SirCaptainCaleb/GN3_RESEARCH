name: Sync NOR research mirror
# architecture refresh trigger 2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-nor-research-mirror.yml"

permissions:
  contents: write

jobs:
  sync:
    uses: ./.github/workflows/sync-research-schema.yml
    with:
      schema: nor
    secrets: inherit
