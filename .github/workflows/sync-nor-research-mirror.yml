name: Refresh NOR research context

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-nor-research-mirror.yml"
      - ".github/workflows/sync-research-schema.yml"
      - ".github/workflows/build-research-schema-artifact.yml"

permissions:
  contents: write
  actions: write

jobs:
  sync:
    uses: ./.github/workflows/sync-research-schema.yml
    with:
      schema: nor
    secrets: inherit

  build:
    needs: sync
    uses: ./.github/workflows/build-research-schema-artifact.yml
    with:
      schema: nor
    secrets: inherit
