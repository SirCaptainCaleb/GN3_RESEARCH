name: Build research context artifact

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Sync research mirror"
    types:
      - completed

permissions:
  contents: read
  actions: write

concurrency:
  group: research-context-artifact
  cancel-in-progress: false

jobs:
  artifact:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout committed mirror
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Assemble lean context bundle from repository state
        run: |
          set -euo pipefail
          rm -rf _artifact
          mkdir -p _artifact

          for schema in gn3n linp template; do
            src="$schema/_context"
            dst="_artifact/$schema"

            test -d "$src"
            test -f "$src/rpc_signatures.txt"
            test -f "$src/rpc_definitions.md"
            test -f "$src/policies/kernel.md"
            test -f "$src/policies/project_policy.md"
            test -f "$schema/vocabulary/standardization_dictionary.txt"

            mkdir -p "$dst/roles" "$dst/research"

            # Entry point and compact API lookup.
            cp "$src/startup_bootstrap.md" "$dst/startup_bootstrap.md"
            cp "$src/rpc_signatures.txt" "$dst/rpc_signatures.txt"
            cp "$src/rpc_definitions.md" "$dst/rpc_definitions.md"

            # Compact policy views live at the schema root.
            cp "$src/policies/kernel.md" "$dst/kernel.md"
            cp "$src/policies/project_policy.md" "$dst/project_policy.md"

            # Roles remain separate operational views.
            find "$src/roles" -maxdepth 1 -type f -name '*.md' -exec cp {} "$dst/roles/" \;

            # Mathematical navigation surface.
            cp "$src/atlas.md" "$dst/research/atlas.md"
            cp "$src/startup_atlas.md" "$dst/research/startup_atlas.md"
            cp "$src/simplified_forest.md" "$dst/research/simplified_forest.md"
            cp "$src/statement_forest.md" "$dst/research/statement_forest.md"
            cp "$src/statement_plus_proof_forest.md" "$dst/research/statement_plus_proof_forest.md"

            # Vocabulary is small enough to live at the schema root.
            cp "$schema/vocabulary/standardization_dictionary.txt"                "$dst/standardization_dictionary.txt"
          done

      - name: Upload research context artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: research-context
          path: _artifact/
          if-no-files-found: error
          compression-level: 9
          retention-days: 7

      - name: Delete older research context artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api --paginate             -H "Accept: application/vnd.github+json"             "/repos/$REPO/actions/artifacts?name=research-context&per_page=100"             --jq '.artifacts[].id' |
          while read -r artifact_id; do
            if [ "$artifact_id" != "$CURRENT_ARTIFACT_ID" ]; then
              gh api --method DELETE "/repos/$REPO/actions/artifacts/$artifact_id"
            fi
          done
