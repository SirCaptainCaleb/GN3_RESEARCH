name: Build research context artifact

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Sync research mirror"]
    types: [completed]

permissions:
  contents: write
  actions: write

concurrency:
  group: research-context-artifact
  cancel-in-progress: false

jobs:
  artifact:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Package GN3N and LINP
        run: |
          set -euo pipefail
          rm -f research-context.zip
          zip -qr research-context.zip gn3n linp
      - name: Save latest snapshot in repository
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp research-context.zip artifacts/research-context.zip

          git config user.name "research-context[bot]"
          git config user.email "research-context[bot]@users.noreply.github.com"
          git add -- artifacts/research-context.zip

          if git diff --cached --quiet; then
            echo "Repository artifact copy already current."
          else
            git commit -m "Update research context artifact snapshot"
            git push origin HEAD:main
          fi
      - name: Upload Actions artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: research-context
          path: |
            gn3n/
            linp/
          if-no-files-found: error
          compression-level: 9
          retention-days: 7
      - name: Publish latest release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release delete research-context-latest --repo "$REPO" --yes --cleanup-tag || true
          gh release create research-context-latest research-context.zip \
            --repo "$REPO" --target main --title "Research Context (latest)" \
            --notes "Latest clean GN3N/LINP research snapshot. Supabase remains authoritative for publication."
      - name: Record artifact metadata in Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          CURRENT_ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          ARTIFACT_NAME: research-context
        run: |
          python - <<'PY'
          import json, os, pathlib, urllib.request
          def manifest(schema):
              return json.loads(pathlib.Path(schema, "MANIFEST.json").read_text())
          payload = {
              "p_revisions": {
                  "gn3n": manifest("gn3n")["snapshot_revision"],
                  "linp": manifest("linp")["snapshot_revision"],
              },
              "p_release_url": f"https://github.com/{os.environ['REPO']}/releases/tag/research-context-latest",
              "p_asset_url": f"https://github.com/{os.environ['REPO']}/releases/download/research-context-latest/research-context.zip",
              "p_commit_sha": os.environ["COMMIT_SHA"],
              "p_artifact_path": f"https://api.github.com/repos/{os.environ['REPO']}/actions/artifacts/{os.environ['CURRENT_ARTIFACT_ID']}",
              "p_repository": os.environ["REPO"],
              "p_workflow_run_id": int(os.environ["WORKFLOW_RUN_ID"]),
              "p_artifact_name": os.environ["ARTIFACT_NAME"],
              "p_artifact_id": int(os.environ["CURRENT_ARTIFACT_ID"]),
          }
          key = os.environ["SUPABASE_SECRET_KEY"]
          headers = {"apikey": key, "Content-Type": "application/json", "Accept": "application/json"}
          if not key.startswith("sb_secret_"):
              headers["Authorization"] = f"Bearer {key}"
          req = urllib.request.Request(
              os.environ["SUPABASE_URL"].rstrip("/") + "/rest/v1/rpc/research_artifact_publish",
              data=json.dumps(payload).encode(), headers=headers, method="POST")
          with urllib.request.urlopen(req, timeout=60) as r:
              print(r.read().decode())
          PY
      - name: Delete older research-context artifacts and runs
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CURRENT_ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          echo "Deleting older research-context artifacts..."
          gh api --paginate "repos/$REPO/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name == "research-context") | .id' |
          while read -r artifact_id; do
            [ -z "$artifact_id" ] && continue
            if [ "$artifact_id" != "$CURRENT_ARTIFACT_ID" ]; then
              gh api --method DELETE "repos/$REPO/actions/artifacts/$artifact_id" || true
            fi
          done

          echo "Deleting older completed artifact-workflow runs..."
          gh api --paginate "repos/$REPO/actions/workflows/build-research-context-artifact.yml/runs?status=completed&per_page=100" \
            --jq '.workflow_runs[].id' |
          while read -r run_id; do
            [ -z "$run_id" ] && continue
            if [ "$run_id" != "$CURRENT_RUN_ID" ]; then
              gh api --method DELETE "repos/$REPO/actions/runs/$run_id" || true
            fi
          done
