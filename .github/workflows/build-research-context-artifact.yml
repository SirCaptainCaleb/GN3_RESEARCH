name: Build research context artifact

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Sync research mirror"
    types:
      - completed

permissions:
  contents: write
  actions: write

concurrency:
  group: research-context-artifact
  cancel-in-progress: false

jobs:
  artifact:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout committed mirror
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Assemble lean context bundle from repository state
        run: |
          set -euo pipefail
          rm -rf _artifact
          mkdir -p _artifact

          for schema in gn3n linp template; do
            src="$schema/_context"
            dst="_artifact/$schema"

            test -d "$src"
            test -f "$src/rpc_signatures.txt"
            test -f "$src/rpc_definitions.md"
            test -f "$src/policies/kernel.md"
            test -f "$src/policies/project_policy.md"
            test -f "$schema/vocabulary/standardization_dictionary.txt"

            mkdir -p "$dst/roles" "$dst/research"

            # Entry point and compact API lookup.
            cp "$src/startup_bootstrap.md" "$dst/startup_bootstrap.md"
            cp "$src/rpc_signatures.txt" "$dst/rpc_signatures.txt"
            cp "$src/rpc_definitions.md" "$dst/rpc_definitions.md"

            # Compact policy views live at the schema root.
            cp "$src/policies/kernel.md" "$dst/kernel.md"
            cp "$src/policies/project_policy.md" "$dst/project_policy.md"

            # Roles remain separate operational views.
            find "$src/roles" -maxdepth 1 -type f -name '*.md' -exec cp {} "$dst/roles/" \;

            # Mathematical navigation surface.
            cp "$src/atlas.md" "$dst/research/atlas.md"
            cp "$src/startup_atlas.md" "$dst/research/startup_atlas.md"
            cp "$src/frontier.md" "$dst/research/frontier.md"
            cp "$src/simplified_forest.md" "$dst/research/simplified_forest.md"
            cp "$src/statement_forest.md" "$dst/research/statement_forest.md"
            cp "$src/statement_plus_proof_forest.md" "$dst/research/statement_plus_proof_forest.md"

            # Vocabulary is small enough to live at the schema root.
            cp "$schema/vocabulary/standardization_dictionary.txt"                "$dst/standardization_dictionary.txt"
          done

      - name: Package research context
        run: |
          set -euo pipefail
          rm -f research-context.zip
          (cd _artifact && zip -qr ../research-context.zip .)

      - name: Upload research context artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: research-context
          path: _artifact/
          if-no-files-found: error
          compression-level: 9
          retention-days: 7

      - name: Publish latest research context release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release delete research-context-latest --repo "$REPO" --yes --cleanup-tag || true
          gh release create research-context-latest research-context.zip             --repo "$REPO"             --target main             --title "Research Context (latest)"             --notes "Latest generated research-context snapshot. Supabase remains authoritative for live updates."             --latest

      - name: Delete older Actions artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api --paginate             -H "Accept: application/vnd.github+json"             "/repos/$REPO/actions/artifacts?name=research-context&per_page=100"             --jq '.artifacts[].id' |
          while read -r artifact_id; do
            if [ -n "$artifact_id" ] && [ "$artifact_id" != "$CURRENT_ARTIFACT_ID" ]; then
              gh api --method DELETE "/repos/$REPO/actions/artifacts/$artifact_id"
            fi
          done

      - name: Record published artifact revision in Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          CURRENT_ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, pathlib, urllib.request

          def revision(path):
              return json.loads(pathlib.Path(path).read_text())["repository_revision"]

          repo = os.environ["REPO"]
          payload = {
              "p_revisions": {
                  "gn3n": revision("gn3n/mirror_manifest.json"),
                  "linp": revision("linp/mirror_manifest.json"),
                  "__template__": revision("template/mirror_manifest.json"),
              },
              "p_release_url": f"https://github.com/{repo}/releases/latest",
              "p_asset_url": f"https://github.com/{repo}/releases/latest/download/research-context.zip",
              "p_commit_sha": os.environ["COMMIT_SHA"],
              "p_artifact_path": f"https://api.github.com/repos/{repo}/actions/artifacts/{os.environ['CURRENT_ARTIFACT_ID']}",
          }

          key = os.environ["SUPABASE_SECRET_KEY"]
          headers = {
              "apikey": key,
              "Content-Type": "application/json",
              "Accept": "application/json",
          }
          if not key.startswith("sb_secret_"):
              headers["Authorization"] = f"Bearer {key}"

          req = urllib.request.Request(
              os.environ["SUPABASE_URL"].rstrip("/") + "/rest/v1/rpc/research_artifact_publish",
              data=json.dumps(payload).encode(),
              headers=headers,
              method="POST",
          )
          with urllib.request.urlopen(req, timeout=60) as response:
              print(response.read().decode())
          PY
