name: Build research context artifact

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-research-context-artifact.yml"
  workflow_run:
    workflows:
      - "Sync research mirror"
    types:
      - completed

permissions:
  contents: read

jobs:
  artifact:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout committed mirror
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Assemble lean context bundle from repository state
        run: |
          set -euo pipefail
          rm -rf _artifact
          mkdir -p _artifact

          for schema in gn3n linp template; do
            src="$schema/_context"
            dst="_artifact/$schema"

            test -d "$src"
            test -f "$src/rpc_signatures.yaml"
            test -f "$src/rpc_definitions.md"
            test -f "$src/policies/kernel.md"
            test -f "$src/policies/project_policy.md"
            test -f "$schema/vocabulary/standardization_dictionary.yaml"

            mkdir -p "$dst/roles" "$dst/policies" "$dst/research_tree"

            # Entry point and compact API lookup.
            cp "$src/startup_bootstrap.md" "$dst/startup_bootstrap.md"
            cp "$src/rpc_signatures.yaml" "$dst/rpc_signatures.yaml"
            cp "$src/rpc_definitions.md" "$dst/rpc_definitions.md"

            # One shared compact kernel plus the project's own policy.
            cp "$src/policies/kernel.md" "$dst/policies/kernel.md"
            cp "$src/policies/project_policy.md" "$dst/policies/project_policy.md"

            # Roles remain separate operational views.
            find "$src/roles" -maxdepth 1 -type f -name '*.md' -exec cp {} "$dst/roles/" \;

            # The mathematical navigation surface gets its own home.
            cp "$src/atlas.md" "$dst/research_tree/atlas.md"
            cp "$src/startup_atlas.md" "$dst/research_tree/startup_atlas.md"
            cp "$src/simplified_forest.md" "$dst/research_tree/simplified_forest.md"
            cp "$src/statement_forest.md" "$dst/research_tree/statement_forest.md"
            cp "$src/statement_plus_proof_forest.md" "$dst/research_tree/statement_plus_proof_forest.md"

            # Vocabulary is small enough to live at the schema root.
            cp "$schema/vocabulary/standardization_dictionary.yaml"                "$dst/standardization_dictionary.yaml"
          done

      - name: Upload research context artifact
        uses: actions/upload-artifact@v4
        with:
          name: research-context
          path: _artifact/
          if-no-files-found: error
          compression-level: 9
          retention-days: 7
