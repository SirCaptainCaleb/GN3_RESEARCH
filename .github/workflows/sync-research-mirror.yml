name: Sync research mirror

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"
  push:
    branches:
      - main
    paths:
      - "scripts/sync_research_mirror.py"
      - ".github/workflows/sync-research-mirror.yml"

permissions:
  contents: write

concurrency:
  group: research-mirror-sync
  cancel-in-progress: false

jobs:
  # Deterministic mirror generation from live Supabase state; manual rebuild trigger.
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Build desired mirror in staging
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python scripts/sync_research_mirror.py

      - name: Reconcile mirror including removals
        run: |
          mkdir -p gn3n linp template
          rsync -a --delete .mirror-stage/gn3n/ gn3n/
          rsync -a --delete .mirror-stage/linp/ linp/
          rsync -a --delete .mirror-stage/template/ template/
          rm -rf .mirror-stage

      - name: Commit changed mirror files
        run: |
          git config user.name "research-mirror[bot]"
          git config user.email "research-mirror[bot]@users.noreply.github.com"
          git add -A -- gn3n linp template
          if git diff --cached --quiet; then
            echo "Mirror already current."
            exit 0
          fi
          echo "Mirror changes:"
          git status --short
          git commit -m "Sync research mirror"
          git push
