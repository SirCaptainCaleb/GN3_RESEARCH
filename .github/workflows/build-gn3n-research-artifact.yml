name: Build GN3N research artifact

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Sync GN3N research mirror"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-gn3n-research-artifact.yml"

permissions:
  contents: write
  actions: write

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    uses: ./.github/workflows/build-research-schema-artifact.yml
    with:
      schema: gn3n
    secrets: inherit
