name: Build LINP research artifact

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Sync LINP research mirror"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-linp-research-artifact.yml"

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    uses: ./.github/workflows/build-research-schema-artifact.yml
    with:
      schema: linp
    secrets: inherit
