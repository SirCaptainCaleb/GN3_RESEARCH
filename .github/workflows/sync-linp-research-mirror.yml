name: Sync LINP research mirror
# audit model refresh

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-linp-research-mirror.yml"
      - ".github/workflows/sync-research-schema.yml"
      - "scripts/sync_research_mirror.py"

permissions:
  contents: write

jobs:
  sync:
    uses: ./.github/workflows/sync-research-schema.yml
    with:
      schema: linp
    secrets: inherit
