name: LINP | Refresh research artifact

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync:
    uses: ./.github/workflows/sync-research-schema.yml
    with:
      schema: linp
    secrets: inherit

  build:
    needs: sync
    uses: ./.github/workflows/build-research-schema-artifact.yml
    with:
      schema: linp
    secrets: inherit
