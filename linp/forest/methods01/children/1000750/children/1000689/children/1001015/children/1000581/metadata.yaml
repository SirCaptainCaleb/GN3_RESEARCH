    detail: "Verified against Feder--Subi (Discrete Appl. Math. 161 (2013), 1421--1426, DOI 10.1016/j.dam.2012.12.025), West--Wise (Discuss. Math. Graph Theory 39 (2019), 271--284), and Džavoronok arXiv:2606.04181. Feder--Subi prove the simple-labeling/no-alternating-square monochromatic antipodal-path theorem without requiring antipodality and establish their 1-switch conjecture for n<=5. West--Wise prove every antipodal edge-coloring of Q_k has a monochromatic antipodal geodesic for 2<=k<=6 and explicitly use alternating-4-cycle/local propagation arguments for Q4--Q6. Džavoronok states the centrally symmetric simply connected 2-complex criterion described. The repository summary is faithful."
