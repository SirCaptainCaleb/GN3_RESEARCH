    detail: "Independent reconstruction: the universal collision bounds restrict the owner rank to 2q-4,2q-3,2q-2. The higher two levels and the mixed (q-1,q) bottom case reduce to certified overlap/triangle outputs. In the residual bottom all-q case, any unique-entrance exact contact already forces repeated source-path intersection, so both contacts must be opposite terminals. With host length p=2q-5, 028c2c3f7167 gives a>=q-4, b>=q-3, a<=q-2 and b in {a,a+1}, hence exactly the five possible contact intervals [q-4,q-3],[q-3,q-3],[q-3,q-2],[q-2,q-2],[q-2,q-1]. Two disjoint ordered intervals must choose the earlier interval from the first two and the later from the last two, giving exactly the four stated patterns. In this residual r_j=q<=r_i-1=2q-5 automatically forces q>=5, so all displayed edge indices are valid."
