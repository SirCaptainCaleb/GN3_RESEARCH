    detail: "Conditional on the stated repeated-intersection hypotheses, the graph argument is correct. Every contributed pair {i,j} or {i,j+1} determines its larger endpoint i as the unique backward collision owner; for fixed {a,b} the alternatives x_a=v_b and x_a=v_{b-1} are mutually exclusive, so Q is simple and has exactly 2|M| edges. An index has at most two incident edges from its own collision and at most one from a collision hitting each of v_t,v_{t-1}, hence Delta(Q)<=4. A maximal matching then dominates at most 7 graph edges per matched edge, yielding ceil(2|M|/7) index-disjoint repeated-intersection pairs. Trust remains blocked upstream because c27aea4c544e failed."
