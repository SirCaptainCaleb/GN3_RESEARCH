    detail: "Independent reconstruction passes. Adding the clean-retained and terminal-retained source-mass bounds gives correction a(11a-6s)/24+(k_--k_+)^2/8 = s^2[(1-t)(5-11t)+3d^2]/24. Near equality with s=(5/8-o(1))p forces t>=5/11-o(1) and |d|<=sqrt((1-t)(11t-5)/3)+o(1). Since at most two midpoint contacts are omitted from k_-+k_+, min{k_-,k_+}/s >= (t-|d|)/2-o(1). The latter function on [5/11,1] has minimum 4/11-sqrt(42)/22 at t=8/11-3sqrt(42)/154, yielding the stated 5(8-sqrt(42))/176 coefficient after s=(5/8-o(1))p. All premises are present on the locked basis."
