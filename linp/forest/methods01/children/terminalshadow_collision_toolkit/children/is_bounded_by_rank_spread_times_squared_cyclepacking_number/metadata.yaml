    detail: "Assign collisions to crossed strict rank jumps; 31cb29f347a8 gives at most D such jumps. For M collisions assigned to one cut, the fixed-cut packing construction e4a44a230fe7, via its nested and crossing proofs, produces ceil((ceil(sqrt(M))-1)/2) edge-disjoint cycles supported entirely on the parent edges E_1,...,E_k. Hence this number is at most nu, so ceil(sqrt(M))<=2nu+1 and M<=(2nu+1)^2. Summing over at most D cuts yields C<=D(2nu+1)^2; D=0 gives C=0."
