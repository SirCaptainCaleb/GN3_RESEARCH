    detail: "The claimed exhaustive classification of extra intersections in the shortcut sequence misses collisions involving the unused terminal v_{h-1} of the bridge edge E_h. A displayed right-block edge E_b with b>=h+2 may have entrance x_b=v_{h-1}; this is a legitimate backward color-terminal collision [h-1,b] causing a nonconsecutive intersection with E_h, but it is neither contained in [j,l], nor contained in [h,i], nor of the stated spanning form a<l<h<b. Thus failure of the shortcut cycle does not imply alternative (B) as stated."
