  last_failure:
    reason: "The first proof step is invalid in the boundary case where an adjacent parent edge F equals the chosen last edge h_{x_i} of P_{x_i}. In the contact-multiplicity setup, mu_{x_i}(h_{x_i})=1 is assigned by convention; it is not the cardinality |(F\\{x_i})∩(V(P_{x_i})\\h_{x_i})|. The hypotheses allow this case when phi(F)=phi(x_i)=r_i-1. Therefore U_11 terminal-singleness does not imply the asserted unique precursor contact c_F, and conclusions (1)–(4) are not established unconditionally. The lemma can be repaired by excluding/handling F=h_{x_i} separately."
