    detail: "The terminal-rank inequality reduces all counted edges to rank q in the odd window. On a length 2q-3 v-ending path, visible entrances are confined to the three vertices of g_{q-1}, while an absent entrance forces the opposite terminal to the left joint only. Three distinct witnesses would occupy all three positions, and the endpoint-chord lemma raises the right joint from q-1 to at least q, contradiction. The p=2q-2 and >=2q-1 refinements follow as stated."
