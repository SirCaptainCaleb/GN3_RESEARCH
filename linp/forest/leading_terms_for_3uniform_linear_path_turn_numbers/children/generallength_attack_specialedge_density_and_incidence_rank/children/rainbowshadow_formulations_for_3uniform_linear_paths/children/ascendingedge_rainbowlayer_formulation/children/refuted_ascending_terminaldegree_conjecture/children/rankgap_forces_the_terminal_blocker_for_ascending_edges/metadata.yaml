    detail: "Independent check: if the forced blocker were x on precursor edge g_i with i>=p-q+2, then either x is the entrance joint of g_i and the prefix through g_{i-1} ends at x with length i-1>=p-q+1, or the prefix through g_i ends at x with length i>=p-q+2. Hence phi(x)>=p-q+1. Ascending gives phi(x)=q-1, so p<=2q-2. Therefore p>=2q-1 forces the blocker to be the other terminal y. (Body uses legacy a(x) notation for endpoint potential.)"
