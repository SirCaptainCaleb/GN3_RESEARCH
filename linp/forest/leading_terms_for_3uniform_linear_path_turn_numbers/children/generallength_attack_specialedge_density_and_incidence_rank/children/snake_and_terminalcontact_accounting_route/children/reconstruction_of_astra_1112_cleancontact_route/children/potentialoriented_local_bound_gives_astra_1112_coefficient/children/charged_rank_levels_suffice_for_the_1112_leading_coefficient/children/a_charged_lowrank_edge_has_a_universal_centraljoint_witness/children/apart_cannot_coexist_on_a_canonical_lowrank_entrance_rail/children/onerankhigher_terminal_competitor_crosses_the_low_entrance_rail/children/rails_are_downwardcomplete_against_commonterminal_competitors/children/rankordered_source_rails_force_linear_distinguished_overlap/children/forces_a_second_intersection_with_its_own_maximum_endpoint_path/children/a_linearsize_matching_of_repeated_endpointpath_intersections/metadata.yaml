    detail: "For each collision one adjacent parent differs from the single host last edge, so U_11 multiplicity one gives a genuine exact contact c_i. bd1e5cb6641b gives the repeated endpoint-path intersection. A vertex is an owner endpoint at most once; each parent edge can be selected for at most two hits and each vertex lies in at most three parent edges of the simple rainbow terminal path, giving at most six contact incidences and total multigraph degree at most seven. A maximal matching covers at most 13 multiedges per matched edge, hence size at least ceil(M/13)."
