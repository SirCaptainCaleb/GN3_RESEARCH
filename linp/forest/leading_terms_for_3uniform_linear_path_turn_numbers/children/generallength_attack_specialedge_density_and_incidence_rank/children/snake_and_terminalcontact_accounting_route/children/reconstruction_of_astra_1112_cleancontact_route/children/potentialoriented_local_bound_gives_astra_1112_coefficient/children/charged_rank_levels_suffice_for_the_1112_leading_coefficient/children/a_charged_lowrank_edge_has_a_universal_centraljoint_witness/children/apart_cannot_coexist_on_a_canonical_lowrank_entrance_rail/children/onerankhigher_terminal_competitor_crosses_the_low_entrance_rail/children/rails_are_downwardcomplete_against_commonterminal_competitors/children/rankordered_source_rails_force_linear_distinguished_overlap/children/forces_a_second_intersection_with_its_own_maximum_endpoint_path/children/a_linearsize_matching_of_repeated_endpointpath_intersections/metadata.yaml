    reason: "The theorem assumes, via 608468bb403b, that every right adjacent parent edge E_{j+1} at a U_11 color-terminal collision has a genuine off-x_i precursor contact c_i with E_{j+1}∩V(R_i)={x_i,c_i}. U_11 does not imply this when E_{j+1} is the last edge h_{x_i} of R_i: contact multiplicity mu_{x_i}(h_{x_i}) is defined to equal 1 by convention, not by counting a vertex in (E_{j+1}\\{x_i})∩(V(R_i)\\h_{x_i}). The hypotheses do not exclude the boundary case phi(E_{j+1})=phi(x_i)=r_i-1 and E_{j+1}=h_{x_i}. Then c_i need not exist, so parts (1)–(3) and the M/7 conclusion are not established. Conditional on genuine exact contacts, the subsequent endpoint-overlap and degree/matching argument is sound."
