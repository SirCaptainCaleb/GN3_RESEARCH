    claim_id: "306ef9ae-2fca-45f4-99f1-9ef8b7f3a6aa"
    detail: "Independent reconstruction: P4-freeness makes each intersection-graph component a connected cograph of diameter at most 2. A universal e has rank 2 and is special. Otherwise rank(e)=3; nonspecialness forces a unique entrance x. For terminal y, every edge through y must meet the bridging edge f at one of its two non-e vertices p,q, so linearity gives exactly two such edges, while the disjoint witness g meets one of them through g∩f, contradicting the earlier no-contact property. Vocabulary matches the project dictionary."
