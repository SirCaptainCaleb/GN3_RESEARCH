    detail: "From 3m<=(2ell-3)n+U and m=floor(2ell/3)n, the lower bound U>=gamma_ell n+2A_phi is exact with gamma residues 3,1,2. Terminal capacity gives 2U<=sum max(0,2phi-3), and the identity max(0,2r-3)=(2r-3)+1_{r=1}+3 1_{r=0} yields exactly (2ell-5)n-2A_phi+N1+3N0. Strict potential increase makes the oriented transition system acyclic."
