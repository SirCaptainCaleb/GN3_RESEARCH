  last_failure:
    reason: "The proof and stated upper bound omit isolated vertices. The step max{0,2phi(v)-3}=(2phi(v)-3)+1_{phi(v)=1} is valid only when phi(v)>=1. For phi(v)=0 the right side is -3, while the left side is 0. No hypothesis in the theorem states that every vertex is incident to an edge or has positive vertex rank. In general the correct identity is max{0,2phi(v)-3}=(2phi(v)-3)+1_{phi(v)=1}+3*1_{phi(v)=0}, yielding 2U <= (2ell-5)n-2A_phi+N_1+3N_0. This is a substantive but straightforward repair."
    recorded_at: "2026-09-24T21:13:02.468757+00:00"
