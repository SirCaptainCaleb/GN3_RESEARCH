    detail: "The propagation phi(c)-kappa_P(c)=constant along a component is fine, but the proof then asserts that distinct vertices on a linear 3-path have distinct integer prefix-edge coordinates kappa_P(c). That is not implied by the statement: distinct vertices can occur at the same host-edge coordinate (for example a private vertex of g_i and the forward joint g_i∩g_{i+1} both admit prefix edge-count i under the stated coordinate). Hence equal component slack plus a rank band does not imply |K|<=B-A+1 without an additional injectivity hypothesis on kappa or a weakened multiplicity factor."
