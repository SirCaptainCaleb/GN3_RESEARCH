    detail: "Verified against the primary journal article and arXiv preprint. The paper is Győri–Salia, JCTB 171 (2025), 36–48, DOI 10.1016/j.jctb.2024.11.003. Theorem 2 gives e(H)<=((k-1)/6)n for n-vertex linear 3-uniform H with no Berge P_k, k>=4; the paper explicitly states sharpness for infinitely many k,n via disjoint k-vertex Steiner triple systems when they exist. The stronger Theorem 3 gives e(partial H)<=((k-1)/2)n for linear {2,3}-uniform H, matching the repository body. The body correctly warns this is a Berge-path theorem, not directly a linear-path upper bound."
