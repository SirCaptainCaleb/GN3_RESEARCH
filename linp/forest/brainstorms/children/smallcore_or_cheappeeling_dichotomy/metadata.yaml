semantic_container_text: null
simplified_statement: "Conjecturally, every P_ℓ-free linear 3-graph either has a vertex of degree at most ℓ-c for some fixed c>3/2 or has an O(ℓ)-vertex exceptional set whose deletion leaves uniformly lower-density components."
