  governing_definitions:
    - "A linear r-graph has any two edges intersecting in at most one vertex."
    - "P_l^(r) is the r-uniform linear path of l edges; for r=3 it has 2l+1 vertices."
    - "ex_L(n,P_l^(3)) is the maximum number of edges in an n-vertex linear 3-graph containing no copy of P_l^(3)."
    - "The snake digraph records incidences (e,v) for which a longest path ending in e may end at v; a special edge contributes all three incidences."
