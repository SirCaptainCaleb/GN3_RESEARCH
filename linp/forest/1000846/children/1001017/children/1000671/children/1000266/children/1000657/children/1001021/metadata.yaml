    detail: "Ordering the contact blocks of f along P, each gap followed by f gives a path entering f through that contact. At most one contact is the unique entrance, so the gap sum is at most (q-1)+(r-1)(q-2), and the r-1 possible one-edge block overlaps yield p<=r(q-1). Thus p>=2q-1 rules out r=2."
