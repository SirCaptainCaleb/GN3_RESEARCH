    detail: "If f misses R_e, then R_e,e,f is a linear (q+1)-edge path: R_e avoids both terminals v,u of e, f is disjoint from R_e by assumption, and distinct linear edges e,f meet exactly at their common terminal v. For phi(f)=q this is overlong; for phi(f)=q+1 it is a longest f-ending path entering f through terminal v rather than unique entrance y. Thus f meets R_e. Reversing the roles, if e misses R_f then R_f,f,e has length phi(f)+1>phi(e)=q, contradiction. All endpoint and nonconsecutive-intersection conditions are satisfied."
