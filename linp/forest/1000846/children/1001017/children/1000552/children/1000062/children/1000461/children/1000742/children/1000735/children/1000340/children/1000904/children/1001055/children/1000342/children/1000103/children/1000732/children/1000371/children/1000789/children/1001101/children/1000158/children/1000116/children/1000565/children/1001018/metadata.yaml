    detail: "Independent reconstruction: the local one-eighth extraction gives sum_v |G_v|>=S/8-o(S), and every f in G_v has phi(f)<phi(v) because G_v is supported at active misaligned centers. Incidences whose opposite terminal u is rank-tight, phi(u)=phi(f), inject into distinct ordered rank-tight terminal incidences (f,u), so 8ac145bb8e95 plus the near-equality defect bound makes their total o(S). Every remaining incidence therefore has strict edge-rank gap at both terminals. An underlying ascending nonspecial edge can occur in at most its two terminal-centered families, so quotienting loses at most a factor two and leaves (1/16-o(1))S distinct edges. Source-cleanliness, terminal-singleness, and the selected common-anchor certificate are inherited from the retained original center; no certificate-transfer claim is needed."
