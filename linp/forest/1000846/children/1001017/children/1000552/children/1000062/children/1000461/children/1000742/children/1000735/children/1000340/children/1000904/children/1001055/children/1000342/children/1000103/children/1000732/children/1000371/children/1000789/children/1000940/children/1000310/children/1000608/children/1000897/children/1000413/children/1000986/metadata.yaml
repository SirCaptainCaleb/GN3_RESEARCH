    claim_id: "bcba98c4-ecde-4953-a9b6-42537954f50a"
    detail: "The displayed cut contradiction is valid, and the required multiplicative locality can be reconstructed without the now-blocked exact-contact lemma. For a collision x_i=v_j, x_i is a terminal of E_{j+1} and phi(x_i)=r_i-1. Applying the certified general terminal-potential bound a7b7670e955a to E_{j+1} gives r_i-1<=2r_{j+1}-2, hence r_i<=2r_{j+1}-1. If j<t<i, monotonicity gives r_{j+1}<=r_t and r_i>=r_{t+1}; therefore r_{t+1}>=2r_t contradicts r_i<=2r_t-1. The original citation through 5ba61d0a77eb is stale, but the theorem itself is sound."
