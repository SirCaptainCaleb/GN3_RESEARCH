    detail: "Independent check of math version 2: every f in T\\{h} must meet the anchor precursor R off v, else appending f to the q-edge h-path gives a (q+1)-edge path; linearity makes these contact sets pairwise disjoint. The certified fixed-entrance transfer bounds singleton contact sets by s_r(q), yielding D_Q(T)>=t-1-s_r(q). Each multiple-contact edge with exactly one U-contact contributes a distinct vertex of R\\U, and the finite-set identity |U\\R|-|R\\U|=|U|-|R|=(r-1)(p-q) gives the second side. The J_max algebra reduces exactly to floor(((r-1)(q-1)-s_r(q))/2)-tau and has leading term ((2r-1)/8)q. The unpaid-signature specialization is valid under the stated q<phi(v) restriction, and the r=3 crossing refinement follows because two anchor contacts exhaust f\\{v}."
