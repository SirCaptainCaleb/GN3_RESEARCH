    detail: "Independent reconstruction of math_version 2. The certified terminal-tail blocker applies to the maximum p-edge path ending at terminal v: if x is absent, e cannot be the last edge, hence u lies in the final q-2 precursor edges. Combining that with prefix appendability yields private witness indices p-q+2..q-1 and joint indices p-q+1..q-1. For q<=Q these give 2Q-p-2 private slots and 2Q-p-1 joint slots, total 4Q-2p-3; endpoint cases give the same count. Linearity makes witness pairs from distinct charged edges disjoint. Therefore |C_Q(v)|<=4Q-2p-3, and i<=|C_{q_i}(v)| gives q_i>=ceil((2p+i+3)/4)."
