    detail: "The proof invokes 608468bb403b to assert that each adjacent parent F in {E_j,E_{j+1}} has exactly one genuine precursor contact on P_{x_i}. But U_11 terminal contact multiplicity one includes the convention that a path's last edge is assigned multiplicity one; the stated hypotheses do not exclude F from being the last edge of P_{x_i} when phi(F)=phi(x_i)=r_i-1. In that case the claimed unique precursor contact c_F need not exist and the subsequent separated/overlapping-contact trichotomy does not apply. The aligned-last-edge case must be excluded or handled separately."
