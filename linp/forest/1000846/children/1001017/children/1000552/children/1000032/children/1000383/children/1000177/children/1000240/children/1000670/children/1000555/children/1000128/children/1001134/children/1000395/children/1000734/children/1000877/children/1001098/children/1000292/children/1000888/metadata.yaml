    reason: "The proof uses that v is not the unique entrance of the later nonspecial edge h, so that the constructed path g_1,...,g_{i_f},f,h enters h through a wrong vertex and equality with phi(h) is impossible. The theorem statement assumes only that f,h are nonspecial edges through external hub v; v could be h's unique entrance. Under the stated hypotheses the construction yields only i_f+2<=r, i.e. i_f<=r-2. To obtain r-3 one must add that v is terminal at h (equivalently v is not h's unique entrance)."
