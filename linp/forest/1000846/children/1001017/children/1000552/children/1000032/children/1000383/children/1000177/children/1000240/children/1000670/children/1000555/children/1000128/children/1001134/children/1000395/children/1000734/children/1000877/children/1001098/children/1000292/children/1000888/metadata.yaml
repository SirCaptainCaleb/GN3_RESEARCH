    detail: "The first-contact prefix meets f only in its final contact and is disjoint from h because i_f<i_h. Since f,h are distinct common-hub edges in a linear 3-graph, they meet only at v, so the displayed concatenation is linear. It enters nonspecial h through terminal v, hence cannot be a longest h-path; therefore i_f+2<=phi(h)-1 and i_f<=phi(h)-3."
