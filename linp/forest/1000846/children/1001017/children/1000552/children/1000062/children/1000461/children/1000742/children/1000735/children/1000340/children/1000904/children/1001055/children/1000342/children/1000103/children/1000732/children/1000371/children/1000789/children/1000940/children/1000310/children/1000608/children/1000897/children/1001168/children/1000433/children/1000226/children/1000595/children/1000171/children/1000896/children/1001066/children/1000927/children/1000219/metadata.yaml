    detail: "Equality in 2cc651f9fa5d with p=2q-5 forces the earlier first-occurrence bound and the later wrong-entrance bound to be tight. Together with b>=p-r+2 and b<=a+1, the earlier contact interval is exactly [q-3,q-2] when its parent has rank q-1, or [q-4,q-3] when its parent has rank q. Disjointness therefore forces the later contact to start at q-1 or q-2 respectively. The general singleton window makes this equality, while its stronger opposite-terminal bound is one smaller, so the later contact must be the unique entrance. Since that entrance lies on R_i and is the last vertex of the distinct-endpoint maximum path R_s, unique-intersection rigidity forces a second common vertex. The overlapping-contact branch gives the stated local linear 3-cycle."
