    detail: "Verified against Mahesh Ramani, arXiv:2609.20173 (updated 2026-09-18). The primary source states that every n-vertex linear r-uniform P_4^r-free hypergraph has at most (r+1)n/r edges for every r>=2, with equality precisely for vertex-disjoint unions of S(2,r,r^2). It also states the sharp incidence-rank inequality (r+1)rank_R N(H)>=r|E(H)| for linear r-uniform H whose line graph is a cograph, with equality exactly when each edge-containing component is S(2,r,r^2). Since a four-edge linear path corresponds to an induced P4 in the line graph of a linear hypergraph, the cograph reduction and rank<=|V| deduction are correct. For r=3 the bound is 4n/3."
