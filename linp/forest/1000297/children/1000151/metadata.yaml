research_interface:
  first_attack: "Let S={v:d(v)>=tau l}. Bound edges meeting S by summing degrees but subtracting the strong overlap restrictions coming from pairwise-linear links. For H-S, root a loose-path BFS from an edge and derive a recurrence for the number of newly exposed vertices when Delta(H-S)<tau l. Determine whether some fixed tau makes both bounds beat 43/48 asymptotically."
  global_relevance: "Current arguments are very local around a longest path. A hub/core decomposition could convert the extremal problem into two simpler global regimes: concentrated incidence, where linearity severely limits overlap among links, and diffuse incidence, where breadth-first expansion should force long paths. The gain would attack the coefficient at its source rather than refine a local defect count."
