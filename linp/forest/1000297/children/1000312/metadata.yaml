research_interface:
  first_attack: "Prune to a nonempty incidence subgraph with controlled minimum weighted degree, then expose two or three BFS layers from a hyperedge-node. Classify the first way a nonbacktracking exploration can fail to give an induced hypergraph path: a repeated left vertex or a cross-edge to an earlier right vertex. Use C4-freeness to inject such failures into distinct local incidences and derive a branching-versus-collision inequality."
  global_relevance: "This attacks the leading term through expansion rather than endpoint accounting. Linearity becomes the strong C4-free condition, so collisions in a breadth-first exploration are expensive and potentially quantifiable. Even a weak collision lemma could yield a fixed constant improvement over l-3/2, while a sharper tree-excess argument might approach the longer-term 2l/3-scale target."
