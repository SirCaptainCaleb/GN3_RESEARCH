research_interface:
  first_attack: "Study a longest induced path Q in the clique-covered graph. For each off-path vertex, record the first and last clique of Q it meets. Use inducedness to show that the set of attachment positions is highly clustered; then double-count incidences between off-path vertices and path cliques. Test whether a three-clique membership condition forces a uniform deficit from the naive l-3/2 coefficient."
  global_relevance: "A constant improvement in the graph theorem translates directly into a better leading coefficient for ex_L(n,P_l^(3)). The representation isolates the special structure absent from arbitrary induced-path-free graphs: each graph vertex belongs to exactly three intersection cliques, and each graph edge lies in exactly one clique. It may expose global induced-path machinery that the current endpoint-local proof never sees."
  role: "brainstorm_conjecture"
