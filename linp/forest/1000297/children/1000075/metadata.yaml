research_interface:
  first_attack: "Fix a longest loose path P and characterize exactly which shadow edges incident to vertices of P are non-liftable extensions because their triangle labels collide with P. Try to prove that along any ordinary shadow path, each previously used hyperedge label blocks only O(1) future steps, yielding a greedy lifting lemma from graph paths whose length is a constant factor larger than l."
  global_relevance: "This changes representation completely. The 2-shadow of a linear triple system has edge-disjoint triangles, so graph-path and forest extremal tools may see global density more cleanly than endpoint-rank charging. A lifting theorem with only sublinear label conflicts could improve the leading coefficient uniformly in l."
