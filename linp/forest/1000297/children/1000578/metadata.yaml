research_interface:
  first_attack: "For one edge e={a,b,c} outside a fixed longest path, define B_x as the event that assigning e to x fails to create a usable extension/splice because of the first contact geometry. Express the random-order assignment probabilities exactly and prove a local inequality sum_x Pr[x is assigned and B_x] <= 1-epsilon whenever e has at least two geometrically distinct path contacts. Then sum over edges and isolate the truly one-contact exceptional family."
  global_relevance: "The present coefficient loss may partly come from committing every edge to one deterministic terminal and paying worst-case local congestion there. Random assignment can symmetrize the three vertices of an edge and convert mutually exclusive obstruction patterns into averaged savings. If the obstruction events at different endpoints cannot all be large in a linear hypergraph, the expectation could produce a strict leading-term gain without classifying every local pattern."
