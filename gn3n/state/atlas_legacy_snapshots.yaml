        - "7736e292d44c"
        - "1b5631196e38"
        - "pairdeletionreconstruct01"
        - "compatrelocationinterval07"
        - "e34dc91e238d"
      purpose: "Unconditional route around the canonical defect-span-three interface. Minimum counterexamples have defect span exactly three; opposite longest-path endpoint deletion covers always expose support/order disagreement. With positive deletion slack, every central deletion reduces to crossing, order disagreement, or same-slot replacement; comparing the two endpoint anchors shows that at most two central labels can remain same-slot from both ends. The general pair-deletion reconstruction lemma isolates the underlying reason: two distinct ordered block structures can be equalized by deleting at most two labels. Thus repeated clean replacement is no longer the main bulk obstruction. The current closure gap is to consume the resulting support crossings and order reversals into endpoint absorption or defect span at most two."
      startup_visible: false
      updated_at: "2026-09-27T19:11:20.976632+00:00"
      when_to_fetch: "Fetch for unconditional longest-path/deletion-cover arguments, positive half-order slack, repeated same-slot replacement, support/order disagreement, or attempts to compress the canonical width-three defect window. The route now produces disturbance densely; further local disturbance production is lower leverage than a theorem consuming it."
