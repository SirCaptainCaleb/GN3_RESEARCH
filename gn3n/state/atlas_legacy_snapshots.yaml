      purpose: "Quadratic-potential toolkit and theorem-scale sharp-half-order route. The reusable complement-imbalance penalty controls Hamiltonian enlargement of one component. In the sharp half-order shell, globally quadratic-minimal three-covers have minimum component order at least about one third of the longest-path order; secondary max-min normalization gives lambda<=3c-3. On the boundary lambda=3c-3, every maximin cover contains a globally longest path, and a whole interval of Hamiltonian support sizes has complements whose every two-cover contains a globally longest path. Earlier four- and five-side endpoint grids are local realizations of the same mechanism. Scope warning: the strongest global bounds are conditional on the sharp half-order shell and do not themselves reduce an arbitrary minimum counterexample to n=2lambda+1."
      startup_visible: false
      updated_at: "2026-09-27T19:05:13.375168+00:00"
      when_to_fetch: "Fetch for global quadratic descent, quadratic/maximin comparison, component-size normalization, sharp-half-order boundary rigidity, Hamiltonian-set complement imbalance, or when varying Hamiltonian support size near the medium scale. Do not treat this route as an unconditional entry into the sharp half-order shell."
