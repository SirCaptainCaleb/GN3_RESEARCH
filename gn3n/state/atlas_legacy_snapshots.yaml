      atlas_key: "canonical-central-bridge"
      category: "route"
      headline: "Canonical central-bridge no-trapping reduction"
      object_ids:
        - "centralbridge35"
        - "centralbridgereach"
        - "caab599920a1"
        - "threesidedescent6"
        - "foursidedescentobstruction"
        - "astra003fivecommoncore"
        - "astra003fiveonepath"
        - "3b95fd7dfc15"
      purpose: "Unconditional theorem-level route from any minimum counterexample. Every exact one-vertex deletion two-cover reaches a canonical central bridge in two Astra-003 moves. The direct branch has a three-vertex bridge; the five-vertex bridge branch passes through a three-vertex bridge state after its first move, so theorem-level closure need only rule out trapping of the canonical three-side neighborhood. A three-side next to a path of order at least six has an immediate strict quadratic descent. The current missing theorem is to show that after this descent one can merge, or preserve/recover enough bridge-controlled geometry to force another descent rather than becoming trapped on a higher-minimum-side plateau."
      startup_visible: false
      updated_at: "2026-09-27T19:05:13.375168+00:00"
      when_to_fetch: "Fetch when seeking an unconditional route to the grand theorem, analyzing canonical deletion-state bridges, or deciding how to turn local quadratic descent into a well-founded no-trapping argument. This is distinct from sharp-half-order-only quadratic normalization."
