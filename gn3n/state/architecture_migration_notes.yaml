-
  body: "\nPhase 1 inventory/preparation only. Production identity conversion has NOT begun.\n\nNatural migration subsystems and order:\n1. Worker/run identity root: runs.worker_id first conceptually, then all worker-bearing consumers (claims, presence, stages, read_sessions/read_receipts, object_authors, certificates, objects authorship fields/array, polls, broadcasts, signals, assignment_requests, scheduler_reviews, research_batch_state, worker_need_suppressions, transition_receipts, standardization_dictionary).\n2. Claims: claims.claim_id before audit_snapshots.claim_id and transition_receipts source/result claim identities.\n3. Stages: stages.stage_id before commit_receipts.stage_id.\n4. Read sessions: read_sessions.session_id before audit_snapshots.read_session_id; read_receipts also depends on worker identity and object IDs.\n5. Audit/certification/authorship: audit_snapshots basis/worker/read-session/claim IDs, certificates verifier identity, object_authors worker identity, and objects origin/last/substantive worker identity fields.\n6. Polls: polls.poll_id before poll_votes.poll_id; worker identity conversion spans proposer/closer/enacter/defer/action-claim/voter fields.\n7. Signals/broadcasts/requests: signals.id before needs.signal_ids; broadcasts.id independently; assignment_requests.request_id independently, with worker identities converted after the worker root.\n8. Scheduler/batch/suppression state: scheduler_reviews.worker_id, research_batch_state initiated/retired worker IDs, worker_need_suppressions.worker_id.\n9. Reasoning-object identity migration is a separate text-ID graph: objects.id/parent_id/tree_path and consumers edges, reasoning_nodes, state pointers, claims/runs/stages/request focus and target IDs, atlas.object_ids, changes.object_ids, certificates/object_authors/read_receipts/read_sessions, polls, needs, presence, and commit receipts. Convert objects and direct FK consumers before array/JSON consumers; tree_path must be rewritten only in the later coordinated conversion.\n10. Atlas derivation must wait until lifecycle/audit/support semantics, supersedes/fence edges, and object-ID migration are stable. Existing gn3n.atlas remains untouched in Phase 1.\n\nAtlas inputs/hazards:\n- objects uses parent_id/tree_path/position for current tree structure; lifecycle_status, audit_status, audit_requested/audit_priority, support_status/support_reason, and reasoning_nodes composition state affect trust/visibility.\n- edge kinds currently include supersedes and fence plus depends_on/consumes/contradicts/bypassed_by/informs/interface/references/strengthens.\n- pending results must later remain visible and marked; obstructing fence results are normally omitted while affected claims are marked.\n- atlas_height is only a rare override; atlas_hidden is intended to hide a subtree; neither is active yet.\n- existing gn3n.atlas is hand-maintained project state and must survive until derived Atlas cutover.\n- JSON payload/state in stages.operations/baselines/read_math_baselines, runs/claims payloads, audit snapshot signatures, certificate manifests, signals evidence, transition result packets, scheduler completion/trigger data, and change details may embed identities not visible from SQL column types. Phase 2 must inspect/rewrite those semantically rather than relying only on typed columns.\n- No existing object ID matches the reserved seven-digit namespace at Phase-1 baseline.\n"
