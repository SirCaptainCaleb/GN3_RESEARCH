  body: "\nGN3N object-ID migration preparation — Type A (scalar references + tree).\n\nScalar object-ID references found:\nENFORCED FK references to objects(id):\n- objects.parent_id\n- reasoning_nodes.object_id\n- edges.from_id, edges.to_id\n- state.grand_theorem_id, current_strategy_id, current_guidance_id, proof_frontier_id, current_bottleneck_id\n- certificates.object_id\n- object_authors.object_id\n- read_receipts.object_id\n- audit_snapshots.target_id\n- presence.scope_id\n- claims.focus_id\n- stages.focus_id\n- runs.focus_id\n- assignment_requests.focus_id\n\nobjects.id is the PK/canonical object identity. objects.legacy_id is UNIQUE but currently entirely NULL (1559/1559); it is not an FK and must remain untouched in this phase/cutover unless a later explicit alias policy says otherwise.\n\nCurrent populated reference counts at preparation time: objects.parent_id 1550; reasoning_nodes.object_id 1171; edges.from_id/to_id 3727 each; certificates.object_id 1231; object_authors.object_id 1565; state.grand_theorem_id 1; all listed FK references had zero missing targets. Current ephemeral focus/scope/audit/read references listed above were empty at inspection time, but are semantically object IDs and must still be rewritten if populated at cutover.\n\nTree representation:\n- tree_path is slash-delimited ancestor IDs including self and trailing slash, e.g. root/child/self/.\n- parent_id is an immediate-parent FK; position is sibling ordering only and contains no ID.\n- subtree queries and overlap checks use tree_path prefix predicates (tree_path LIKE root_path||'%').\n- move_object takes the project tree advisory xact lock, computes a new prefix, then performs one set-based UPDATE over the live subtree: new_prefix || suffix_after_old_prefix. It does not recurse.\n- tree_path has a btree text_pattern_ops partial index for live rows; parent_id has a partial live-row btree index.\n- objects has BEFORE/AFTER triggers affected by tree_path/parent_id changes (notably elevation-depth maintenance, reasoning parent-move validation, unary-chain refresh).\n\nRecommended tree rewrite for ID renaming:\nDo NOT perform naive text replace. Freeze the old→new mapping, then rebuild each tree_path by splitting on '/', mapping each complete component through the frozen mapping, and joining with '/' plus the trailing '/'. This is mechanical, set-based, collision-proof for IDs that are substrings/prefixes of other IDs, and replacement order is irrelevant. parent_id should be mapped by exact equality. For live rows, a stronger final verification is expected_path = (parent is null ? mapped_id||'/' : parent.tree_path||mapped_id||'/').\n\nHistorical hazard:\n1559 total objects; 1288 live. All 1288 live rows currently satisfy immediate parent/path consistency. 14 trashed rows have stale tree_path values relative to their current parents, reflecting historical subtree moves/recompositions; therefore an all-history parent/path equality check currently fails even before migration. Decide explicitly whether the cutover normalizes trashed historical paths or preserves them as historical snapshots. If paths are mechanically component-mapped without structural normalization, those 14 remain internally stale by design.\n\nCutover ordering recommendation (single integration transaction):\n1. Quiesce object-mutating workflow and acquire the same project tree advisory xact lock used by create/move operations.\n2. Materialize/freeze the canonical old→new mapping and validate uniqueness/collision freedom.\n3. Rewrite non-FK scalar object consumers whose constraints would otherwise block the PK rename only after making FK constraints deferrable for the transaction or temporarily dropping/recreating them; current object-reference FKs are NOT DEFERRABLE.\n4. Rewrite exact scalar FK consumers and objects.parent_id from old IDs to new IDs, and rewrite tree_path component-wise from the same frozen mapping.\n5. Rewrite objects.id itself in the same transaction, coordinating FK strategy so no intermediate referential-integrity violation is observed. Because current FKs are nondeferrable and no ON UPDATE CASCADE is present, the integrator must explicitly choose either temporary FK removal/recreation or a shadow-column/key-swap strategy; simple parent/child UPDATE ordering cannot satisfy both sides.\n6. Rewrite Type-B-owned arrays/JSON/staged/historical consumers in the same atomic cutover before exposing the project again.\n7. Recreate/validate any temporarily removed FKs and indexes; normal btree indexes can remain if updates are in-place, but constraints must be handled deliberately.\n8. Verify: every scalar FK resolves; no old changed ID remains in scalar fields; every live tree_path's components equal its ancestor chain; each live row's final path equals parent.tree_path||id||'/' (or id||'/' at roots); no duplicate paths/IDs; subtree prefix queries return the same logical node sets under mapped IDs; reasoning-parent integrity and unary-chain/tree health checks pass.\n9. Commit, then resume workflow.\n\nManual-review semantics:\n- objects.legacy_id: alias/history field, currently empty; do not repurpose implicitly.\n- presence.scope_id and focus_id fields are object IDs when populated, despite being ephemeral.\n- audit_snapshots.target_id is an object target.\n- historical trashed tree paths require an explicit normalize-vs-preserve decision.\n- control-center functions hard-code object/tree semantics and must be updated only by the later control-center/integration phase, not here.\n\nNo object ID, legacy_id, parent_id, tree_path, edge, array, JSON consumer, wrapper, public RPC, or control_center function was modified by this worker. Only this preparation note was written.\n"
