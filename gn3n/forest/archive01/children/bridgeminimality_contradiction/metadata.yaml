  first_attack: "Write the two canonical bridge forms explicitly and analyze only repartitions of the bridge with one neighboring inherited outer path. Use the three checked bridge triples plus boundary antisymmetry at the first outer triple to derive a dichotomy: either a direct concatenation merges components, or moving one/two endpoint vertices across the bridge yields a strictly more balanced exact two-cover of that pair union. The key is to prove this with path checks only, independent of ambient order."
  global_relevance: "The certified two-move construction already places every deletion state inside a trapped canonical bridge component and strictly lowers Phi from the singleton lift. If canonical bridges themselves cannot be local minima for Phi, iterating inside a finite trapped component is impossible. This would prove the order-independent no-trapping statement and hence the grand theorem."
