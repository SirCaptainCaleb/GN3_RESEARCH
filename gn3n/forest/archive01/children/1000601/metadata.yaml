  first_attack: "Fix v and an equal-rank in-neighborhood X. For each u in X choose an extremal path P_u ending (u,v) with Hamiltonian complement Q_u. Use boundary antisymmetry to orient X by (u,v,w). If u has many outneighbors w outside P_u, appending w shortens the Hamiltonian complement by one; test whether a one-vertex Hamiltonian-deletion lemma for Q_u forces a higher R(v,w). Quantify the obstruction when the deleted complement is not Hamiltonian."
  global_relevance: "This tries to lift the successful terminal-pair rank argument from a single long path to the actual two-cover objective. A rank bound would be global and order-independent, bypassing the current endpoint-kernel machinery rather than refining it."
