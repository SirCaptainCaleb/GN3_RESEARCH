  first_attack: "At a Phi-minimal trapped state, record for each ordered pair of components which endpoints of the larger component fail to enlarge the smaller one Hamiltonianly. Order these six endpoint-failure bits lexicographically after the size potential. Prove that whenever a pairwise repartition preserves Phi, one of these obstruction bits must improve unless the two components are already mergeable."
  global_relevance: "Astra-003 already packages the problem as escape from trapped three-cover components. A successful canonical orientation would turn local escape lemmas into a global termination theorem without classifying component sizes or orders."
