research_interface:
  first_attack: "Formalize a path-extension digraph whose states are ordered terminal pairs and whose arcs append one vertex when the corresponding oriented triple is legal. Translate a spanning two-cover into two disjoint state-walks covering all vertices. For a hypothetical minimal failure, derive a smallest vertex/transition separator and prove that minimality forces each separator element to be tight; then inspect whether the resulting alternating dependency of oriented triples violates the boundary condition."
  global_relevance: "This attacks the theorem from the opposite side. Rather than constructing a cover directly, characterize what a genuine obstruction would have to look like and then use the boundary structure to rule it out. A strong dual theorem could bypass the current endpoint-transport bottleneck entirely."
