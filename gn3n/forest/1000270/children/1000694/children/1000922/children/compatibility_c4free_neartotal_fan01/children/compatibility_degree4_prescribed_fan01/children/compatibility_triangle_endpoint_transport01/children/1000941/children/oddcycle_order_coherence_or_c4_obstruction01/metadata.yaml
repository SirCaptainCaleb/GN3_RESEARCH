metadata:
  audit_anomaly_reason: "The proof omits shortest directed 3-cycles. A directed triangle in the orientation of the complement C_n need not lie in any balanced support S_i, so transitivity on each S_i does not exclude it. For an independent triple with cyclic gaps delta_1,delta_2,delta_3, it extends to a maximum independent k-set iff exactly one delta_j is odd; when all three gaps are odd its largest independent extension has size k-1, so such a triangle is not controlled by any S_i. The stated global-order-or-C4 dichotomy therefore needs a triangle alternative or an additional argument excluding these odd-gap directed triangles."
  audit_anomaly_recorded_at: "2026-10-02T02:13:32.730852+00:00"
