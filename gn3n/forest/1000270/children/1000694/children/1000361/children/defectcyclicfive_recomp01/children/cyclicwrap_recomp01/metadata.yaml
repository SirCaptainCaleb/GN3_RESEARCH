    detail: "Independent reconstruction succeeds. Using the certified proper cyclic run classification and the original cut, deletion of the cut vertex removes exactly one wrap defect for {1,1,1} and for the 111 incarnation of {3,1}, and exactly two for {2,1,1}, {3,2}, and the 101 incarnation of {3,1}. In the double-wrap cases the two failed wrap triples reverse by boundary antisymmetry to the consecutive tight triples (v_2,v_1,v_n) and (v_1,v_n,v_{n-1}), giving the tight four-path (v_2,v_1,v_n,v_{n-1}); minimum-counterexample calculus gives complementary path-cover number two. The five-run is explicitly excluded, so no additional case is omitted."
