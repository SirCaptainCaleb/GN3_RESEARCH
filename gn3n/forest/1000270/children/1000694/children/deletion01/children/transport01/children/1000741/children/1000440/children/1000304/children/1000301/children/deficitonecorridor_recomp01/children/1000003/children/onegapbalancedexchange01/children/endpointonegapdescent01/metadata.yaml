    detail: "Independent check passed on the repaired premise basis. In an endpoint gap, every surviving balanced exchange inserts z between the first two exterior vertices and, after deleting the exterior endpoint, preserves the deficit-one one-gap form while reducing the exterior count. Prefix balance at z forces z to be a_0 or a_1 (symmetrically at the terminal end); the latter immediately yields the bounded endpoint kernel, while the former strictly decreases the nonnegative exterior count. Thus the iteration terminates."
