    detail: "Independent check: for distinct d,e in U, a non-Hamiltonian five-set T union {d,e} would have acyclic comparison digraph, contradicting the directed comparison 3-cycle already present on T. Hence T union {d,e} is Hamiltonian. Complementarity and minimality give pc(U-{d,e})=2; Hamiltonicity of U-d would imply Hamiltonicity of a two-deletion by deleting a path endpoint; U itself cannot be Hamiltonian because T has a tight 3-path. Thus all claimed radius-two exclusions and component-size consequences follow."
