  audit_resolution:
    claim_id: 373
    detail: "Checked the general half-order block arithmetic. In a crosswise two-crossing endpoint cover of H-q0, B=Q-q0 has order lambda-1 and X has order lambda+1. If the paired B-block has order r, the two lambda-component constraints force X-block orders lambda-r and r+1. Restoring q0 to either component gives D=1 states by d8dce2799f24. Their deficient supports intersect the original X in lambda-r and r+1 vertices respectively, hence have Johnson distances r+1 and lambda-r. The nearer distance is min(r+1,lambda-r)<=ceil(lambda/2), with lambda=6 giving radius three. The conclusion that block sizes alone do not provide a lambda-uniform radius is therefore exact."
    math_version: 3
    outcome: "pass"
