    claim_id: 401
    detail: "For two covers of the same sharp-shell deletion, t=0 indeed forces the same unordered support partition. If t>0, a single block on either original lambda-side would be adjacent to the opposite side and create a path longer than lambda, so both block counts are at least two and t>=2. At t=2 both are exactly two; putting both crossings in one component would include an entire lambda-side plus a nonempty opposite block, impossible. Hence the crosswise four-block shape is correct."
