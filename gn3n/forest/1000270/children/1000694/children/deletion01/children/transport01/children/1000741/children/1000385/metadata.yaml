metadata:
  audit_resolution:
    claim_id: 401
    detail: "Checked the one-crossing endpoint reduction. The unique-crossing block lemma with D={endpoint}, S=A-endpoint, C=U gives one full A-block and two U-blocks; longest-path maximality forces the attached U-block to be a singleton. At the two ends this yields Hamilton paths on (A-a0)+u and (A-am)+v plus U-u,U-v. If u≠v the induced exact U-covers have different supports; if u=v, two-sided endpoint replacement applies because A+u is non-Hamiltonian by global maximality. Thus double crossing or explicit disagreement is exhaustive."
    math_version: 7
    outcome: "pass"
    recorded_at: "2026-09-21T04:49:21.63344+00:00"
