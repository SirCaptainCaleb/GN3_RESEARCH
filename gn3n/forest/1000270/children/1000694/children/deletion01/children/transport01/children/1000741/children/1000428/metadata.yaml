    detail: "Independent check: |S|=0,1 follows from the cyclic-kernel deletion-stability theorem. For S={d,e}, the certified cyclic-kernel exterior-forcing theorem makes (X-{u})∪{d,e} Hamiltonian for every u∈X. If K-{d,e} were Hamiltonian, these two paths would exactly two-cover H-u with a 5-vertex side, contradicting mu>=6. Minimality then gives pc(K-S)=2. Singleton and doubleton components in a two-cover of K are excluded by the |S|=1,2 non-Hamiltonicity."
