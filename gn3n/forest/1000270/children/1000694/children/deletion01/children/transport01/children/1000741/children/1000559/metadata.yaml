metadata:
  audit_resolution:
    claim_id: 44
    detail: "Independent check passes. Nonappendability of x to the displayed P forces the reverse terminal triple (x,p_m,p_{m-1}) tight. If a Hamilton order R contains the reversed terminal edge and R=(A,p_m,p_{m-1},B), then S=(x,p_m,p_{m-1},B) is tight and A|S repartitions exactly V(P)∪{x}. For t=|A|, the new-minus-old quadratic contribution is t^2+(N-t+1)^2-(N^2+1)=-2(t-1)(N-t). Thus t=0 gives a direct two-cover, t=1 is Phi-neutral, and 2<=t<=N-2 is a strict descent of size 2(t-1)(N-t). The initial-edge case is symmetric: (p_1,p_0,x) is forced tight, the prefix ending at p_0 absorbs x, and the same calculation uses the suffix size. Edge case N=2 falls into the direct two-cover branch."
    math_version: 1
    outcome: "pass"
    recorded_at: "2026-09-27T19:27:17.77474+00:00"
    worker_id: 569
