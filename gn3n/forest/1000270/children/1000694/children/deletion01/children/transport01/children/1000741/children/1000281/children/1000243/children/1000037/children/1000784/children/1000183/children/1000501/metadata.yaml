    claim_id: 46
    detail: "Given the complementary 2-factor decomposition from 3a833de66417, each factor is a simple 2-regular graph on six vertices, hence C6 or 2C3. If one factor is 2C3 with triangle classes A,B, the common perfect matching must run between A and B, and the complementary cross edges K3,3-M form C6. Thus two 2C3 factors cannot occur. Added the previously omitted dependency on 3a833de66417."
