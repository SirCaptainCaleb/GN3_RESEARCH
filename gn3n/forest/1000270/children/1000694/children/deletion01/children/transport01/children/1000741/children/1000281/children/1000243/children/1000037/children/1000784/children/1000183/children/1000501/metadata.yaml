    claim_id: 182
    detail: "Independent check: complementary 2-factors of K6-M are each either C6 or 2C3. If one factor is two triangles, every perfect-matching edge of M must cross the triangle bipartition, so the complementary factor is K3,3-M, which is a six-cycle. Hence two 2C3 factors cannot coexist and the two stated unordered types are exhaustive."
