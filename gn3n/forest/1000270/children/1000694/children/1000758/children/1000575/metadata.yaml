    detail: "Reconstructed the proof completely. With exactly two cross-class edges in an order-13 6|6 deletion cover, cutting them gives four blocks; {t} is one block, so exactly one of A (order 6) and B_y=Q-y (order 5) splits. If B_y split while A stayed whole, the assumed direct A--B_y crossing would place all six A-vertices plus a nonempty B_y-block in one path component, contradicting the universal component order six. Hence A splits and B_y is whole. Its direct A-neighbor block must be a singleton a_y, since that component has order six, yielding support (Q-y+a_y)|(X-a_y). If the two endpoint labels coincide, X-a and both endpoint replacements of Q by a are Hamiltonian while Q+a is non-Hamiltonian, so insert01 forces relative-order disagreement. If the endpoint labels are distinct from each other and t, the three fixed-Q deletion covers have pairwise-compatible supports; absent X-side order disagreement they are pairwise compatible as ordered covers, so gapgeom01 puts all three labels in one common gap. The common base has order four. In the transitive precedence case the certified two-deep-gap theorem forces at least two base vertices on each side, hence exactly a 2|2 middle gap; an endpoint gap therefore cannot be transitive and is cyclic. Correct, with support provisional until premise 1c2a492efc83 receives an independent certificate."
