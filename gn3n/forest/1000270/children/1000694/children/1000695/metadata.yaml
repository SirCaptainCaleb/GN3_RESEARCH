  first_attack: "Define the weakest transport datum preserved when passing between covers of H-x and H-y on H-{x,y}. Prove a two-deletion compatibility lemma: if the induced transport between x and y is trivial in both directions, then the two local covers admit a common refinement on H-{x,y}. Then test whether transport around a triple x,y,z must compose trivially by the boundary-tournament axioms."
