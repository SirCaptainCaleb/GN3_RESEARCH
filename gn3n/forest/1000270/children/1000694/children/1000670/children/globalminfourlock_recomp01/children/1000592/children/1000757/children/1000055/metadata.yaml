    detail: "Independent check passes. The certified endpoint-pair grid supplies Hamiltonian F. Minimum-counterexample calculus gives pc(H-F)<=2, while Hamiltonicity of H-F would combine with F to give a spanning two-cover, so pc(H-F)=2. For any U|V of H-F, global Phi-minimality gives u^2+v^2>=m^2+r^2-9 and u+v=m+r-1. Writing d=|m-r| and delta=|u-v| yields delta^2>=d^2+2(m+r)-19>d^2 because m+r>=12. Thus delta>d; when m>=r, a complement smaller side at least r would force delta<=d-1, contradiction."
    math_version: 1
    outcome: "pass"
