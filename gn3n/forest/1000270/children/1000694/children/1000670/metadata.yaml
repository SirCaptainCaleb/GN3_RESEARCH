semantic_container_text: "Defect-span local-search route: lexicographically minimal spanning orders and quadratic-minimal three-covers are pushed through local swaps, endpoint complements, canonical central 3/5 states, and size-gap descent toward defect span at most two."
simplified_statement: "Conjecturally, every lexicographically defect-minimal spanning ordering has defect span at most two."
