research_interface:
  first_attack: "Write the five- or six-vertex window consisting of two vertices before/after the leftmost defect plus the next tight run. Enumerate symbolically which triples flip under the two shortest rotations. Prove a local lemma: unless a second defect lies within distance two, one of the rotations strictly improves the lexicographic defect objective. Then mirror at the rightmost defect and try to make the obstruction windows incompatible."
  global_relevance: "A spanning ordering has defect span at most two exactly when it encodes a two-cover, so this attacks the conclusion directly with a scalar/local-search invariant. It avoids choosing deletion covers, support partitions, or half-order states."
