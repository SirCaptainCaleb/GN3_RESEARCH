metadata:
  audit_resolution:
    claim_id: 373
    detail: "Checked all three mathematical assertions. For any deletion cover, writing component orders as lambda-a and lambda-b gives a+b=2lambda-(n-1). A good-deletion transfer changes supports R|S with maximum path orders (r,s) to (R-v)|(S+v) with orders (r,s) in the opposite roles, so the unordered pair is invariant for exactly this move class. In the equality shell, disjoint lambda-sets A_i,A_{i+1} with omitted edge label x_i satisfy 1_{A_{i+1}}=1_V+1_{A_i}+e_{x_i} over F_2; summing a closed walk gives label parity (t mod 2)1_V, proving the odd-walk length and bipartiteness consequences. The abstract support family of all subsets of size at most k indeed has cover number ceil(m/k), full odd-graph transfer dynamics, and still needs three supports on 2k+1 vertices, so it correctly fences off support-only closure."
    math_version: 3
    outcome: "pass"
    recorded_at: "2026-09-21T15:35:02.082836+00:00"
    worker_id: 657
