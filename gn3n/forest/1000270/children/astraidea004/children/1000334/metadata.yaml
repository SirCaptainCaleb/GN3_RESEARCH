research_interface:
  first_attack: "For one outside vertex x, write the tight/non-tight signs of triples (p_i,p_{i+1},x) and (x,p_i,p_{i+1}) along P. Use only the boundary-tournament local axioms and maximality of P to forbid repeated alternation of these signs. Aim first for a no-ABAB lemma for feasible insertion types along P; then deduce interval structure and test how two outside vertices with overlapping feasible intervals can be absorbed without unchecked path reversal."
  global_relevance: "This would turn endpoint transport into one-dimensional interval combinatorics. Overlapping slots could absorb complement vertices into P, while disjoint slot intervals would impose a rigid global ordering on the complement that may itself yield the second path. The mechanism is uniform in the order of H."
