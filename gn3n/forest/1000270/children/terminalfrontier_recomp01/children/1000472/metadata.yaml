    detail: "Independent reconstruction: the two gap-one pairs either already expose a canonical witness or each has a Hamiltonian endpoint enlargement. If one endpoint of A enlarges both smaller paths, the certified common-donor theorem supplies the standard crossing disturbance. Otherwise the two donor sets are disjoint and reduce to the opposite-donor configuration B+x, C+y Hamiltonian and B+y, C+x non-Hamiltonian. Order-disagreeing enlargement orders already close the case. For an order-neutral two-cover of H-{x,y}, at least two residual-core crossings give either multiplicity >=3 or, at equality two, the usual split-core crossing/leave-and-return alternatives. With exactly one crossing, d4e6e9fba9ed localizes the good insertions to the sole join and f5a0b71835ae forces a bounded reverse cross triple. The donor-set possibilities are exhaustive."
