metadata:
  audit_request_reason: "Independent reconstruction requested: verify that the top-cover square normalization uses only the four pc2 square states and no Hamiltonian four-core hypothesis."
  audit_request_recorded_at: "2026-09-30T13:10:01.606741+00:00"
  audit_resolution:
    claim_id: 215
    detail: "Independent reconstruction passed. The proof uses only the hypotheses that G,G-d,G-e,G-{d,e} are non-Hamiltonian pc2. If a top two-cover has both labels as endpoints, singleton and {d,e}-component degeneracies are excluded by lower-state non-Hamiltonicity, so deleting either/both labels preserves two nonempty paths. Otherwise every top cover has at least one label internal; if neither label is universally internal, choose covers with d endpoint/e internal and e endpoint/d internal. Different support partitions give outcome (3); identical support partitions force distinct linear orders on the common d-support, hence a reversed common pair and outcome (4). No ambient core or minimum-counterexample hypothesis is used."
    math_version: 1
    outcome: "pass"
