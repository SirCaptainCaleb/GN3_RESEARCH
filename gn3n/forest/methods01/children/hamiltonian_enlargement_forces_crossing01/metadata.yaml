metadata:
  audit_request_reason: "Independent reconstruction requested: verify the abstract cut argument that a two-cover of H-v respecting A|B would separately Hamiltonize A and B, and a Hamiltonian A+v would then two-cover H."
  audit_request_recorded_at: "2026-09-30T13:24:32.364234+00:00"
  audit_resolution:
    claim_id: 346
    detail: "Independent check passed. If a two-cover T1|T2 of H-v has no ordinary edge crossing A|B, then each T-component lies wholly within one side. Since A and B are both nonempty and exactly two components cover A∪B, after relabelling T1 Hamiltonizes A and T2 Hamiltonizes B. Replacing T1 by the assumed Hamilton path on A∪{v} gives a spanning two-cover of H, contradicting pc(H)>2. No minimum-counterexample, endpoint, or size hypothesis is needed."
    math_version: 1
    outcome: "pass"
