  audit_resolution:
    claim_id: 46
    detail: "The explicit four-vertex orientation assigns exactly one member of each of the twelve reversal pairs. The order (1,3,0,2) is Hamiltonian, while A=(3,2,0) is tight after deleting 1. Prepending 1 fails because (1,3,2) is reversed by tight (2,3,1); appending 1 fails because (2,0,1) is reversed by tight (1,0,2). This is a valid counterexample to arbitrary endpoint extension."
