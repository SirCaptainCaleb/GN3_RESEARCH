    detail: "Independent check: the edge-order construction defines a valid boundary tournament; the five color-order possibilities all force a repeated vertex under v_i=c_i-v_{i-1} mod 5, while (1,4,2,0) is a Hamilton path on X. On mixed triples, every (x,p_i,p_j) with x∈X is non-tight, so a tight path ending in two P-vertices cannot contain X. Hence any purported 5|(m-1) cover with the long component ending in a pair from P leaves an X+{p_i} support, which is a copy of the non-Hamiltonian five-set."
