    detail: "Independent check passed. Choose seven balanced 4|4 partitions, yielding fourteen distinct complement-paired Hamiltonian four-sides. If any two Hamiltonian four-sets meet in three vertices, the conclusion holds. Under the contrary assumption that no such adjacent pair exists, the 14 selected sides contain 14*4=56 distinct triples, hence form a 3-(8,4,1) block family. For any fixed pair {u,v}, exactly three selected blocks contain it, while certified fixed-pair orientation classes on the other six vertices produce at least C(s,2)+C(6-s,2)>=6 Hamiltonian four-sets through {u,v}. Any additional such four-set shares a triple with its unique selected block, contradicting the no-adjacent-pair assumption. A packaging issue was recorded because the proof directly cites balanced8_multiplicity7_01 without declaring it as a direct dependency."
