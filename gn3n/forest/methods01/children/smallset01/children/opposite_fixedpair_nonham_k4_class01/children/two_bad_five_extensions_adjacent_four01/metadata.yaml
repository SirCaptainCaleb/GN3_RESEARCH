    detail: "Independent check passed. Assuming no adjacent edges forces a 2+2 fixed-pair orientation split and all cross four-sets non-Hamiltonian. Their cyclic K4 case is incompatible with the acyclic comparison digraph of the non-Hamiltonian five-set X+a. The three possible matching-block placements synchronize across the rectangle; both extreme placements yield explicit Hamilton paths in X+a, while the middle placement forces comparison inequalities that, combined with a Hamilton order on X, again yield an explicit Hamilton path in X+a or X+b. Hence adjacent Hamiltonian-four edges are forced."
