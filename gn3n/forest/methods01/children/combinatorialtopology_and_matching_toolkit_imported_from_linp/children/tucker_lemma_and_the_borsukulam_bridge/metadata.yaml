    detail: "Verified against Freund--Todd, JCTA 30 (1981), 321--325, DOI 10.1016/0097-3165(81)90027-3, and modern authoritative treatments. The classical antipodally labeled triangulated-ball statement and complementary-edge conclusion are correct; Freund--Todd indeed give a constructive proof based on Reiser's algorithm. Modern sources explicitly identify Tucker's lemma as a combinatorial statement equivalent to Borsuk--Ulam. The repository's two elementary PL/uniform-continuity implications to and from the no-antipodal-extension form are mathematically sound."
