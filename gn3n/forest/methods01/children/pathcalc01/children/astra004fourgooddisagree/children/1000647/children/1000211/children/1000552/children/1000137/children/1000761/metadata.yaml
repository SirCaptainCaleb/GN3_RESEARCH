  repair_reason: "The proof misapplies 2d06838dc40e. For a fixed cycle edge ui ui+1, that theorem gives universal two-sided extension of that edge and the complement hook (ui,rm,r{m-1}); it does not give the needed next-vertex hook (u{i+1},rm,r{m-1}) without a separate no-reversal hypothesis for the next cycle edge. Thus the displayed four-path (ui,u{i+1},rm,r{m-1}) is not proved. Universal extension does give a different Hamiltonian four-path (rm,ui,u{i+1},r{m-1}), but that loses the claimed reversed terminal-edge positioning, so adopting it would materially weaken the interface."
