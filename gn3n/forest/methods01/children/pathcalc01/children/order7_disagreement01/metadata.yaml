    detail: "Recomposition equivalence verified. The target directly reconstructs the fixed-pair orientation-class mechanism: among n-2>=5 exterior vertices one orientation class has at least three labels, and a 3-vertex tournament on those labels supplies y->z->w, yielding the two four-paths (y,b,z,a) and (z,b,w,a) with opposite relative order on {b,z}. This faithfully preserves the certified endpoint_reversal_fixedpair01 plus fixedpair_three_disagree01 package and strengthens the entry hypothesis to every boundary tournament of order at least seven."
