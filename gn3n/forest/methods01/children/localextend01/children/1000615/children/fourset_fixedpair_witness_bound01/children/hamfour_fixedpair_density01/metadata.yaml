  audit_request_reason: "Independent reconstruction requested: fixed-pair same-class witnesses plus the certified four-witness multiplicity cap should give the stated universal Hamiltonian four-set density, including 42/81/135 at orders 8/9/10."
  audit_request_recorded_at: "2026-09-30T05:08:36.291697+00:00"
  audit_resolution:
    claim_id: 137
    detail: "Independent reconstruction passed. For each fixed pair T, the exterior r-2 vertices split into two orientation classes, and every same-class exterior pair produces a Hamiltonian four-set. The same-class pair count is minimized by the balanced split, giving s_m=C(floor(m/2),2)+C(ceil(m/2),2). Summing over C(r,2) fixed pairs gives at least C(r,2)s_m witness incidences, while certified fourset_fixedpair_witness_bound01 caps each four-set at four incidences. Hence h4>=ceil(C(r,2)s_m/4). The values 42,81,135 for r=8,9,10 and the asymptotic density 3/4 are arithmetically correct."
    math_version: 1
    outcome: "pass"
