    detail: "Independent check passed. The alternating-five theorem supplies a tight three-side X={L,R,x} with pc2 complement. For n>=14 the two complementary path orders sum to n-3>=11, so one has order at least six. threesidedescent6 applies in one legal move, with potential drop 2m-8 or 4m-20, and its new Hamiltonian support contains all of X. The inherited remainder plus the untouched third path two-cover H-W; H-W cannot be Hamiltonian in a minimum counterexample, so pc(H-W)=2."
