    claim_id: 326
    detail: "Independent check: if no distinct y,x,z form y->_A x->_B z, then any x with A-indegree at least two must be a sink of B. A tournament has at most one sink, so A would have at most one vertex of indegree >=2, bounding total indegree by 2n-2, contradicting n(n-1)/2 for n>=5. The resulting two tournament arcs plus (a,x,b) give the alternating tight five-path."
