    claim_id: 214
    detail: "Independent check passes. For fixed selected edge e_a and transfer label x, exactly one support of F_a omits x. In the singleton-transfer normal form of 68deffb43319 that support is one endpoint S of the alternative x-labelled edge. Since an x-labelled sharp-shell edge consists of two disjoint lambda-supports covering V(H)-{x}, its other endpoint T_x=V(H)-(S union {x}) is uniquely determined. The same normal form makes T_x a component support of every partner F_b using label x, hence every such selected e_b is incident with T_x and their number is at most deg_J(T_x)."
