    claim_id: 214
    detail: "Independent check passes. In the disturbance-free forest normal form every selected component is a path of at most five edges. Fixing an edge e_a in a largest alpha-edge component C, every outside edge e_b is support-incompatible with F_a; excluding the fully crossed branch leaves a singleton-transfer label x. The lexicographic replacement lemma forces e_x into C (a third component would have more than alpha edges), and x is distinct from a, leaving at most alpha-1 possible labels. transferlabelcapacity01 gives at most two outside partners per label, so |E(J)|-alpha<=2(alpha-1), hence |E(J)|<=3alpha-2<=13."
    math_version: 1
    outcome: "pass"
