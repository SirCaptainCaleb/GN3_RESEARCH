metadata:
  audit_request_reason: "Independent reconstruction requested: >=36 balanced four-sides on the fixed nine-set cover at least eight labels; every label of every four-side should be locked against the common long interior because its endpoint-pair five-support is Hamiltonian and would otherwise give strict (4,a)->(5,a-1) descent."
  audit_request_recorded_at: "2026-09-30T05:16:20.153324+00:00"
  audit_resolution:
    claim_id: 301
    detail: "Independent reconstruction passed. Each balanced 4|5 partition A|B of W gives an equal-Phi state A|B|P in the same trapped component. Since a>=7, A+p1 and A+pa are non-Hamiltonian or else the pair A|P strictly descends to 5|(a-1). Certified two_bad_five_extensions_all_opposite01 then makes (A-{w})+{p1,pa} Hamiltonian for every w in A. If M+w were Hamiltonian, these two supports would again give a strict 5|(a-1) repartition of A|P, contradiction; hence w is noninsertable into M. At least 36 distinct four-sides cannot be supported on only seven W-labels because C(7,4)=35, so their union contains at least eight labels, all sharing the claimed common-interior lock."
    math_version: 1
    outcome: "pass"
    recorded_at: "2026-09-30T13:28:19.615101+00:00"
