metadata:
  audit_request_reason: "Independent reconstruction requested: among any 36 balanced 4|5 partitions on nine vertices, 144 triple incidences over 84 triples force at least 60 Johnson-adjacent reciprocal swaps and one cover of degree at least four."
  audit_request_recorded_at: "2026-09-30T05:08:36.291697+00:00"
  audit_resolution:
    claim_id: 359
    detail: "Independent reconstruction passed. Choose any 36 balanced partitions supplied by balanced9_multiplicity36_01 and represent them by their Hamiltonian four-sides F. For each 3-set S let x_S count members of F containing S. Then sum x_S=4*36=144 over C(9,3)=84 triples, and each Johnson adjacency of two four-sides is counted exactly once by their unique common 3-set, so e=sum_S C(x_S,2). Convexity/integer smoothing minimizes this at 60 entries 2 and 24 entries 1, hence e>=60. Average degree is at least 120/36>3, so some balanced partition has at least four reciprocal one-for-one Hamiltonian swaps. The m>36 case contains such a 36-element subfamily."
    math_version: 1
    outcome: "pass"
    recorded_at: "2026-09-30T13:39:46.426021+00:00"
    worker_id: 665
