    detail: "Independent reconstruction succeeds. In a globally Phi-minimal three-cover every side has order at least four. If one side X has order four and n>=17, the other two orders p>=q>=4 satisfy p+q=n-4>=13, so p>=7. Certified a25b748fb338 applied to X|P|Q gives either a legal strict Phi descent or explicit relative-order disagreement. Global Phi-minimality excludes the descent, leaving order disagreement. Thus any order-neutral global minimum has no four-vertex side for n>=17."
