    detail: "Independent reconstruction succeeds. In the no-endpoint-descent branch of foursidedescentobstruction, U-p_1 and U-p_m are non-Hamiltonian, while the crossed deletions U-x_0 and U-x_3 are Hamiltonian. The certified four-of-six theorem forces at least four Hamiltonian five-deletions of U, so all four U-x_i must be Hamiltonian. If U is non-Hamiltonian, the four-good-deletion disagreement theorem forces relative-order disagreement. If U is Hamiltonian, repartitioning X|P as U|(p_2,...,p_{m-1}) changes orders (4,m) to (6,m-2) and strictly decreases Phi by 4m-24>0 for m>=7."
