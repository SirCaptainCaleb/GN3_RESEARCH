metadata:
  audit_resolution:
    claim_id: 238
    detail: "Independent reconstruction passes. Maximin compression plus the sharp half-order path cap gives rho>=ceil(lambda/2), while bd7998713cd1 and lambda=3c-3 give 6rho<=9c-5, forcing equality rho=ceil(lambda/2) in both parities. For c>=4 this rho exceeds the secondary-maximal quadratic minimum side c, so every maximin cover has strictly larger Phi. If c=2k, the algebra with m+r=10k-5 and the extremal maximin upper profile (6k-3,3k-1,3k-1) gives 2(M-Phi_0)=4k-3-d^2>0. If c=2k+1>=5, the sharp maximin residue applies because 2rho=lambda and every path complement has order at least lambda+1; its profile (6k,3k+1,3k) gives 2(Phi_*-Phi_0)=4k-d^2>0. Thus the stated imbalance bounds and |m-r|<sqrt(2c) follow. The previously missing logical dependency edges to bd7998713cd1 and maximin01 were added before certification."
    math_version: 1
    outcome: "pass"
    recorded_at: "2026-09-27T18:45:50.039225+00:00"
    worker_id: 569
