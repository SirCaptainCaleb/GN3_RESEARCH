    detail: "Independent check passes. If X∪{e} were Hamiltonian for an endpoint e of a path of order m>=7, replacing orders 5,m by 6,m-1 would lower Phi by 2m-12>0, so every displayed long-path endpoint is a bad extension. The preceding two-bad-extension lemma gives the Hamiltonian five-set replacement for every endpoint pair. Minimum-counterexample calculus makes its complement non-Hamiltonian with path-cover number two, and global Phi-minimality at fixed complementary total m+r forces every complement two-cover to have imbalance at least |m-r|."
