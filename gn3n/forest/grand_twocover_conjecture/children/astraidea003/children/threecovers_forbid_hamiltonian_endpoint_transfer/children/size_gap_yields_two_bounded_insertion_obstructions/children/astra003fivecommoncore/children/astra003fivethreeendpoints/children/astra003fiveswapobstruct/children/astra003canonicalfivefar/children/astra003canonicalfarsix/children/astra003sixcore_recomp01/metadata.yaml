  audit_resolution:
    claim_id: 148
    detail: "Independent reconstruction succeeds. From U non-Hamiltonian with U-a and U-b Hamiltonian, four-of-six gives |G|>=4 and a,b in G; the certified order-disagreement and prescribed-overlap theorems give the stated disagreement and, for each c in {a,b}, a partner e with U-{c,e} Hamiltonian. Since only a,b lie outside D, |G_D|>=2. If all four core labels are good, bipartiteness of the fixed-pair bad-extension graph on D guarantees a nonedge whose complementary two deleted core labels are both good. If exactly three core labels are good and no required simultaneous-deletion four-core existed, the unique bad core label would be bad-adjacent to all three good labels, forcing those three into one orientation class relative to a,b; the parallel-middle theorem then Hamiltonizes U minus the unique bad label, contradiction."
    math_version: 1
    outcome: "pass"
