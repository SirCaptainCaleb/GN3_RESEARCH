    claim_id: 239
    detail: "Faithful recomposition. Fixed-singleton fibers are one-move cliques, so singleton-label sets of distinct omission-containing components are disjoint. The certified order-eleven shell gives at least nine labels in every such component, forcing uniqueness on eleven vertices; existence of a 5|5|1 state for every singleton then places every equitable omission state there, and the certified two-move 4|4|3-to-5|5|1 bridge places the entire 4|4|3 surface there as well. No hypothesis or exceptional case from the source package is lost."
