    detail: "Reconstructed directly. At a degree-two cycle state, each r in T_{i+1} gives a distinct transfer support P_r. Its Johnson distance to R_{i+2} is 1+|T_{i-1}∩T_{i+2}|; degree two forces the intersection to have size three, hence T_{i-1}=T_{i+2} and period three. The resulting only possible 3-cycle is independently excluded using an odd-graph edge labelled by c outside the three support triples, which creates a third Gamma-neighbor."
