    claim_id: 446
    detail: "Independent exact check passed. For a non-Hamiltonian complement F of order 4,5,6, the cited small-set facts guarantee some z∈F with F-z Hamiltonian. The original tight path P together with a Hamilton path of F-z is then a two-cover of H-z. H-z cannot be Hamiltonian because adjoining the singleton z would two-cover H, so this cover is exact. Its smaller component has order at most |F|-1≤5, contradicting μ≥6. The one-defect consequence follows directly from δ=μ+1."
