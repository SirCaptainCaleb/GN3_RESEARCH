    claim_id: 46
    detail: "Four rooted-eight applications give at least 84 incidences on 35 triples, so some deleted triple is good for at least three roots. For D=X-T, absent order disagreement each pair-extension six-set is Hamiltonian by four-of-six plus the four-good-deletion theorem. Compatible pair paths then invoke 92efe67cef7b. If D+r+s+t is Hamiltonian, among three marked root positions in a seven-term Hamilton order two lie in some four-consecutive block; if non-Hamiltonian, all roots share one insertion gap and any pair lies with two adjacent core vertices in a Hamiltonian four-block. Hence the claimed root-anchored four-window follows."
