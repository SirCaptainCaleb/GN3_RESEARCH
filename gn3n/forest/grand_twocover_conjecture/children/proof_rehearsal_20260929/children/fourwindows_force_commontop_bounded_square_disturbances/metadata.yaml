    detail: "Independent reconstruction passed. The 2/5 four-window density follows by five-set deletion counting; both global and anchored common-core constructions are valid. The graph Gamma has alpha<=2 by four-of-six, its edges yield full pc=2 squares by minimum-counterexample calculus, and the square normal form gives a vertex-cover set I of universally internal labels. The positional averaging bound is correct. For a nonadjacent chosen pair, the inherited segment must be crossed in every lower cover; the four-class transition inequality gives at least two crossings. In the equality case, each class is one T-block; any changed block order is already an order disagreement, while inherited orders plus an M-end crossing satisfy the hypotheses of the certified same-end-extender lemma, yielding outcomes (4) or (5). The stated global distance specialization follows from N=n-3 and s>=ceil(2N/5)-2."
