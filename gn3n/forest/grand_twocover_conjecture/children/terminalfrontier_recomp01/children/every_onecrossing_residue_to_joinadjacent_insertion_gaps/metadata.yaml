metadata:
  audit_resolution:
    claim_id: 155
    detail: "Independent reconstruction: for a two-cover T of H-{x,y}, transition counting across M|B|C gives at least one cross-core edge. With exactly one and no order disagreement, cutting it leaves exactly three monochromatic blocks, so M,B,C each occur as one whole displayed-order block and one is isolated while the other two concatenate. If B is isolated, C|M would combine with B+x and the inherited extension (M,y) to two-cover H, so the concatenation must be M|C. Any successful y-insertion deeper than the first two C-gaps preserves the two triples at the M-C join, again yielding a two-cover with B+x; hence y is confined to the first two gaps. The C-isolated case is symmetric. If M is isolated, the same argument using (M,y) and (x,M) confines x to the last two B-gaps and y to the first two C-gaps, with the reversed concatenation mirrored. This proves the stated localization."
    math_version: 1
    outcome: "pass"
    recorded_at: "2026-09-28T02:05:35.45336+00:00"
