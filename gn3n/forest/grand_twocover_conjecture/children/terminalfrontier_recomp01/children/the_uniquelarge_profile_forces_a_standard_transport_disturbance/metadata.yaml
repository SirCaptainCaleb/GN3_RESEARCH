  audit_resolution:
    claim_id: 396
    detail: "Independent check: for any two-cover T of H-x, transition counting across the three equal cores A0,B,C gives t>=1. If t=1, cutting the unique cross-core edge leaves exactly three monochromatic blocks, one per core; since T has two components, one block is an entire T-component and equality forces it to contain its whole core. Because adjoining x Hamiltonizes every core, replacing that component by a Hamilton path on core union {x} yields a spanning two-cover of H, contradiction. Hence t>=2. When t=2 the block counts are 2,1,1; the split core's two blocks either lie in different T-components, forcing an inherited core edge across components, or in one T-component separated by another-core block, giving a leave-and-return excursion."
    math_version: 2
    outcome: "pass"
