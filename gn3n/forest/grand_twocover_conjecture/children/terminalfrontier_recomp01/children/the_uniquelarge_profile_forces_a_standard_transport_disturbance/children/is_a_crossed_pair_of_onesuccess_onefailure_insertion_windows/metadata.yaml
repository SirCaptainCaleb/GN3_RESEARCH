  audit_resolution:
    claim_id: 155
    detail: "Independent reconstruction: applying the certified gap-one dichotomy to A|B and A|C leaves nonempty donor-endpoint sets S_B,S_C unless an excluded canonical witness already occurs. Excluding the common-donor branch makes these disjoint nonempty subsets of the two endpoints of A, hence after relabeling S_B={a_0}, S_C={a_r}; the crossed enlargements are Hamiltonian and the opposite enlargements are non-Hamiltonian. In the no-order-disagreement branch any Hamilton order on B+a_0 or C+a_r preserves the core order and therefore is an insertion into that displayed order; two different insertion positions would themselves order the inserted label differently relative to an intervening core vertex, giving order disagreement, so the successful position is unique. The opposite labels are noninsertable and inherit the failed-insertion normal forms. The two good enlargements are disjoint and give the stated two-cover of the complement of A's interior."
    math_version: 1
    outcome: "pass"
