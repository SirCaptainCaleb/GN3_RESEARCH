    detail: "Independent check succeeds. In the no-descent branch, the crossed five-set A is Hamiltonian and its complementary five-set F is non-Hamiltonian. The certified order-ten exchange-matrix bounds give at least 15 X-good and 20 Y-good incidences among 25 cells, hence at least 10 double-good cells. If every double-good cell lay in the two rows corresponding to transferred labels t_i,t_{i+2}, the other three rows would each contribute at least four Y-good/X-bad cells, giving at least 12 X-bad cells, contradicting the column bound of at most 10. Thus a double-good cell exists outside those two rows; its Hamiltonian five-set retains both transferred labels, so the resulting 5|5|5 cover cannot be either equal-profile canonical antipode, and therefore lies outside the canonical cube."
