    detail: "Independent reconstruction: for cyclic defect runs {3,1}, cutting at an internal vertex of the three-edge run deletes its two incident defects, leaving the surviving end defect and the separate one-edge run as two isolated defects. Thus the rotated linear pattern is 101. The two deleted cyclic defects are exactly the two wrap failures; antisymmetry reverses them into the overlapping tight triples forming the displayed four-path, and minimum-counterexample complement calculus gives path-cover number two off that proper Hamiltonian support."
