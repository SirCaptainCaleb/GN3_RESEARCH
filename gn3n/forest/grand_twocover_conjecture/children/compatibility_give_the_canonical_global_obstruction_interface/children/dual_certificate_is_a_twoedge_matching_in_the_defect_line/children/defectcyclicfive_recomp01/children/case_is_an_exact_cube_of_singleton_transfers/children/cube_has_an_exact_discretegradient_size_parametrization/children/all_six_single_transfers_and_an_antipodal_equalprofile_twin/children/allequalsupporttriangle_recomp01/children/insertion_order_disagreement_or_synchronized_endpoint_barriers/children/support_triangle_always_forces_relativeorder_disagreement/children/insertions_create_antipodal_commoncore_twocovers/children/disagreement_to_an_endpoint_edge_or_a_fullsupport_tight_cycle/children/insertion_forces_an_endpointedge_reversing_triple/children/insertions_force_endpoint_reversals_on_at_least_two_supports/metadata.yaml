metadata:
  audit_resolution:
    claim_id: 295
    detail: "Independent check succeeds. For R_j, insertion types L,M,R induce transferred-label orders t_{j+2}<t_j<t_{j+1}, t_j<t_{j+2}<t_{j+1}, and t_j<t_{j+1}<t_{j+2}; these reverse respectively the cyclic pair of P_{j+1}, both pairs for P_{j+1} and P_{j+2}, and the pair of P_{j+2}. For every reversed pair, the path-intersection cycle alternative is impossible: in types L/R the reversed segment is all of R_j, while in type M the segment relevant to P_{j+1} reaches the terminal end of R_j and that relevant to P_{j+2} reaches the initial end. Hence one exterior truncation piece is empty, and the cycle/truncation construction Hamiltonizes all of U=H-M_k, which together with tight M_k would two-cover H. Therefore each reversed pair gives an endpoint-edge reversing triple. P_i receives no reversed pair exactly when R_{i-1} is type R and R_{i-2} is type L. Two distinct i cannot both satisfy this because their conditions force one common R_j to be both L and R. Thus at least two distinct P_i receive endpoint reversals."
    math_version: 1
    outcome: "pass"
    recorded_at: "2026-09-28T03:07:23.393075+00:00"
