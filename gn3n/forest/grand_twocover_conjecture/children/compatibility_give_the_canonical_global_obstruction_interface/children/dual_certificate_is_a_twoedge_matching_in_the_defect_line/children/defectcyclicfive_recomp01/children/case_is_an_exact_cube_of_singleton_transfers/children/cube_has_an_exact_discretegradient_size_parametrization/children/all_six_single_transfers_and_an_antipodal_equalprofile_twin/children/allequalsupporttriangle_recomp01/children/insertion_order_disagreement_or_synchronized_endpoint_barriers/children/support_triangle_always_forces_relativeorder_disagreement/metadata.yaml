    claim_id: 61
    detail: "Independent reconstruction succeeds. For x_i=t_{i+2}, noninsertable+Hamiltonian gives order disagreement by noninsertableorderdisagree01. Noninsertable+non-Hamiltonian gives the correctly oriented terminal barrier (t_{i+2},t_{i+1},a_i), reversing the pair t_{i+1},t_{i+2} relative to P_{i+1}. Therefore absence of disagreement forces all three x_i to insert. The three insertion paths all contain {t_1,t_2,t_3} and preserve respectively t_1<t_2, t_2<t_3, t_3<t_1; they cannot induce one common linear order, so some pair disagrees on a common transferred-label pair. This is exactly the standard relative-order disturbance interface."
