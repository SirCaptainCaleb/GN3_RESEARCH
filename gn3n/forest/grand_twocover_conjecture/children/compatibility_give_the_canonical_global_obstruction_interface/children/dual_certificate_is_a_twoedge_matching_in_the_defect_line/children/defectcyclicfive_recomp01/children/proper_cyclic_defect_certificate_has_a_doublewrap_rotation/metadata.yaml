metadata:
  audit_resolution:
    claim_id: 442
    detail: "Independent reconstruction succeeds. For every proper cyclic run type other than the three-edge matching, one can choose a degree-two vertex q in a nontrivial run so that nu(Gamma-q)=2: the middle of the 2-run for {2,1,1} and {3,2}; an internal vertex adjacent to an end of the 3-run for {3,1}; and the second vertex from an end of the 5-run for {5}, leaving a 3-run. Thus both defect edges incident with q become the two failed wrap tests of the rotation, whose reversals concatenate to the tight four-path (v_2,v_1,v_n,v_{n-1}). Since the minimum counterexample has order greater than ten, this four-set is proper, and its complement has path-cover number two. The matching type {1,1,1} has no degree-two defect vertex and is correctly the sole exception."
    math_version: 1
    outcome: "pass"
