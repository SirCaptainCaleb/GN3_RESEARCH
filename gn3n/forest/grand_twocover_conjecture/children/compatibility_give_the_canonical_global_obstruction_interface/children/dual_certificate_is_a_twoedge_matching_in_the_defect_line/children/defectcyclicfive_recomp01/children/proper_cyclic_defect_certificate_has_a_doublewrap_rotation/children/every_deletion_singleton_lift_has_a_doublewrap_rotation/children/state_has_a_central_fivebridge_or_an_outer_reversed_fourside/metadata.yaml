    detail: "Independent reconstruction succeeds. The two endpoint-adjacent triples around the deleted singleton are forced non-tight; if the middle join also fails, their reversal mates concatenate to the stated central five-path. If the middle join is tight, both cyclic wrap triples cannot be tight, and exactly one wrap defect would make the singleton lift a proper {1,1,1} cyclic defect matching, excluded by certified 8ededbb50716. Hence both wraps fail and reverse to the stated outer four-path, whose complement is two-coverable by minimum-counterexample calculus."
