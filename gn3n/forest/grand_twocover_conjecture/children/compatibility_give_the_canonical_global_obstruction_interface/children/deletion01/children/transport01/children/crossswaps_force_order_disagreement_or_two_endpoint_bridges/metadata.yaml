metadata:
  audit_resolution:
    claim_id: 416
    detail: "Reconstructed the asymmetric-pivot splice. After symmetry, (q_j,x,p_{i+1}) and its opposite-side reverse (q_{j+1},x,p_i) are tight. Together with the pivot paths (Q_L,x) and (x,P_R), the first central triple makes K=(Q_L,x,P_R) tight, so K|P_L|Q_R is a spanning three-cover with nontrivial side components. Concatenating K P_L creates exactly beta_P=(p_{m-1},p_m,p_0) and alpha_P=(p_m,p_0,p_1); they cannot both be tight. The certified cyclic-rotation lemma then says exactly one tight gives a distinct Hamilton order of P (hence path-order disagreement), while neither tight gives the reversed endpoint four-path (p_1,p_0,p_m,p_{m-1}). The symmetric Q_R K argument is identical. Thus absent order disagreement both endpoint bridges are forced simultaneously."
    math_version: 4
    outcome: "pass"
    recorded_at: "2026-09-21T11:38:32.964996+00:00"
