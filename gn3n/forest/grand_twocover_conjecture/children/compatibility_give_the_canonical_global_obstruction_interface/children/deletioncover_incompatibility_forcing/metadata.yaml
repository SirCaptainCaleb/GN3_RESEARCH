semantic_container_text: "Deletion-cover incompatibility forcing: turn sparse or structured compatibility neighborhoods into uniform incompatibility families, endpoint transport constraints, and bounded obstruction patterns that feed the global deletion-state closure route."
simplified_statement: "Conjecturally, deletion covers can be chosen so that compatibility constraints force a K4 unless a direct two-cover already exists."
