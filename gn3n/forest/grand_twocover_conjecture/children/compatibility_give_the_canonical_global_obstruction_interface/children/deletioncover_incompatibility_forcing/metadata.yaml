research_interface:
  first_attack: "For each deleted vertex choose an exact two-cover minimizing a canonical pair-state signature. Analyze triples of deletion labels a,b,c. If F_a and F_b disagree, the existing compatible-pair localization says disagreement must appear as support separation, same-slot insertion, or adjacent-slot reversal. Prove that among sufficiently many labels, these local disagreement types cannot all coexist without two labels sharing the same support/order data relative to a third, yielding a compatibility triangle that extends to a fourth label."
  global_relevance: "This would turn the grand theorem into a global consistency statement across deletion covers rather than a local transport process. It is order-independent and exploits a certified sharp gluing theorem: enough compatibility is already closure, so the only task is to force compatibility density from antisymmetry and path order."
