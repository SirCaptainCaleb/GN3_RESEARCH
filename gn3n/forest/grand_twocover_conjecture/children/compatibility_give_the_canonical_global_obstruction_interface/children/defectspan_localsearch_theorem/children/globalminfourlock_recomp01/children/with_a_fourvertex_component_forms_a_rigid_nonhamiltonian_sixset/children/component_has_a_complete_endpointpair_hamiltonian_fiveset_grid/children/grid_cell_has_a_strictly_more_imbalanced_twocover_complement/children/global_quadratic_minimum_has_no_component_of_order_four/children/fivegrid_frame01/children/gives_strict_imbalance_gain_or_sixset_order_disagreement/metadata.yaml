    claim_id: 219
    detail: "Independent check passes. Every displayed endpoint is a non-Hamiltonian extension of the five-set X, since a Hamiltonian extension would transfer one endpoint from a path of order t>=7 to X and decrease Phi by 2t-12. The two-for-two replacement lemma therefore gives a six-set S with at least four Hamiltonian deletions. If S is non-Hamiltonian, astra004fourgooddisagree gives order disagreement. If S is Hamiltonian, 40c4a8aca820 with c=5,h=1 gives delta^2>=d^2+2s-23. Since r>=7 this forces delta>d; opposite parity makes delta-d odd, and delta=d+1 would imply 4r<=24, contradiction. Hence delta>=d+3, q<=r-2 and p>=m+1."
    math_version: 1
    outcome: "pass"
    recorded_at: "2026-09-27T18:36:22.870638+00:00"
