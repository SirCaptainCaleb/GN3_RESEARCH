    detail: "Independent check passes. With a secondarily balanced global Phi-minimum having minimum side 5, m+r=2lambda-4 and m<=lambda imply m in {lambda-2,lambda-1,lambda}; lambda>=14 gives r>=10, so 73b4a2a15831 applies to every endpoint pair. Its Hamiltonian branch contradicts the path-order cap when m=lambda; decreases Phi by 26-2lambda when m=lambda-1; and when m=lambda-2 decreases Phi except for the lambda=14,p=lambda equality case, where Phi is equal but the new cover has minimum side 6, contradicting secondary maximality. Thus every endpoint pair yields the non-Hamiltonian order-disagreement branch."
