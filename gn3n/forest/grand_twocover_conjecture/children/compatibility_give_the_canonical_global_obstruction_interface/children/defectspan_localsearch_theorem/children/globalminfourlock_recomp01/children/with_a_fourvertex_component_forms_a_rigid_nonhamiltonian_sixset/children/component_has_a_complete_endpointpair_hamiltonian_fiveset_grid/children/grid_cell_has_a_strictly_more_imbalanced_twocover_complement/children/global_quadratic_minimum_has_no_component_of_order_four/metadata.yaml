    detail: "Independent check passes. For lambda>=10, the trapped-component minimum-side theorem gives c>=4. If c=4, the sharp-shell arithmetic forces r>=6 and the endpoint-pair imbalance argument yields the rigid profile 4,lambda-1,lambda-2 together with a competing 5,lambda,lambda-4 cover. For lambda>=11 the latter has strictly smaller Phi; for lambda=10 it has equal Phi but minimum component order 5 rather than 4, contradicting the stated secondary extremal choice. Hence c>=5."
