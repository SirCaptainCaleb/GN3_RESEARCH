semantic_container_text: "Unconditional route around the canonical defect-span-three interface. Minimum counterexamples have defect span exactly three; opposite longest-path endpoint deletion covers always expose support/order disagreement. With positive deletion slack, every central deletion reduces to crossing, order disagreement, or same-slot replacement; comparing the two endpoint anchors shows that at most two central labels can remain same-slot from both ends. The general pair-deletion reconstruction lemma isolates the underlying reason: two distinct ordered block structures can be equalized by deleting at most two labels. Thus repeated clean replacement is no longer the main bulk obstruction. The current closure gap is to consume the resulting support crossings and order reversals into endpoint absorption or defect span at most two."
simplified_statement: "Two-coverability is equivalent to a spanning order of defect span at most two, while minimum counterexamples have defect span three and their deletion covers obey strong compatibility and insertion constraints."
