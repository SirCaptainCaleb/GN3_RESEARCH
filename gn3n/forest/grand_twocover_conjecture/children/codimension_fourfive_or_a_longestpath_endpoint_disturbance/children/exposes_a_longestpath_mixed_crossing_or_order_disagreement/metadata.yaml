    detail: "Independent reconstruction succeeds. Begin from any deletion two-cover and choose the larger side Q. If Q is globally longest, the small enlarged side C has at least four Hamiltonian deletions by 6f72075b0b54, so the longest-path mixed-crossing/order-disagreement theorem applies directly. If Q is not globally longest, choose a globally longest path A. The certified order-12 reduction 96aa7439b5a9 gives a non-Hamiltonian complement U of order four or five; every 4-set has four Hamiltonian 3-vertex deletions, and a non-Hamiltonian 5-set has at least four Hamiltonian 4-vertex deletions by the certified small-set theorem. Hence the same longest-path endpoint theorem applies to A,U and yields the stated mixed crossing or order disagreement."
